:root{--green:#0c6644;--ink:#13231d;--muted:#65736c;--line:#d9e1dd;--soft:#edf2ef;--bg:#f3f6f4;--danger:#a12626;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:not-allowed}
.app{max-width:1180px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{font-weight:850;font-size:21px}.muted{color:var(--muted)}.small{font-size:12px}
.pill{background:#dfe9e4;padding:7px 11px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #0000000b;padding:16px}
.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:9px;border:1px solid #bdc9c3;background:#fff;font-weight:700;display:inline-block}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45}
.btn.on{background:#111;color:#fff;border-color:#111}
.linkBtn{border:0;background:none;color:var(--green);text-decoration:underline;font-weight:700;padding:0 4px}
.sets{display:flex;justify-content:center;gap:7px;margin:6px 0;flex-wrap:wrap}
.sets span{padding:5px 10px;border-radius:7px;background:var(--soft);font-size:13px;font-weight:700}
.sets .active{background:var(--green);color:#fff}.sets .done{background:#d4e4dc}
.status{text-align:center;margin:8px 0 12px;color:#53615a;font-weight:600}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{border-top:7px solid var(--team)}
.team h2{margin:0 0 6px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 9px;border-radius:99px;background:var(--soft);font-weight:800;font-size:12px;white-space:nowrap}
.score{font-size:68px;font-weight:850;line-height:1;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums}
.point{width:100%;padding:18px;border:0;border-radius:12px;background:var(--team);color:#fff;font-size:20px;font-weight:850}
.point:disabled{background:#aab4af}.point.verify{outline:3px dashed #ffffffcc;outline-offset:-8px}
.court{margin:14px auto 6px;max-width:390px;border:3px solid #bdc9c3;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#bdc9c3}
.pos{background:#f8faf9;padding:9px 4px;text-align:center;min-height:64px}
.pos small{display:block;color:#68756f;font-size:11px}.pos b{font-size:21px}
.pos.lib{background:#fff4e6}.pos.target{outline:3px solid var(--green);outline-offset:-3px;background:#e8f2ed;cursor:pointer}
.badge{display:inline-block;padding:1px 6px;border-radius:99px;font-size:11px;font-weight:800;vertical-align:middle;margin-left:3px;background:#e3c5b0;color:#3b2a1d}
.badge.l{background:var(--green);color:#fff}
.bench{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.libBtn{padding:8px 12px;border:2px solid #b9c7c0;border-radius:10px;background:#fff;font-weight:800}
.libBtn.selected{border-color:var(--green);background:#e8f2ed}.libBtn.return{border-style:dashed;border-color:var(--green);background:#f3f8f5}
.serveLine{text-align:center;font-weight:800;min-height:22px;font-size:14px}
.hint{text-align:center;font-size:13px;color:var(--green);font-weight:700}
.warning{background:#fff5dc;border:1px solid #ecd189;padding:10px;border-radius:10px;margin:8px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.log{max-height:340px;overflow:auto;border-top:1px solid #e2e8e5;margin-top:8px}
.event{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:8px 3px;border-bottom:1px solid #edf1ef;font-size:14px}
.event b{font-variant-numeric:tabular-nums}.event small{display:block;color:#7b8781}
.edit{padding:4px 10px;border:1px solid #ccd6d1;background:#fff;border-radius:6px;font-size:13px}
.overlay{position:fixed;inset:0;background:#0b1712cc;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:20}
.modal{position:relative;width:min(760px,100%);background:#fff;border-radius:18px;padding:20px;margin:auto}
.modal.wide{width:min(1240px,100%)}.modal h2{margin:0 36px 6px 0}.modal h3{margin:14px 0 6px}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.actions .left{margin-right:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}
label{font-size:14px;font-weight:600}label.check{display:flex;align-items:center;gap:8px;padding-top:26px}
.field{display:block;margin-top:4px;padding:10px;border:1px solid #cbd5d0;border-radius:9px;font-size:16px;width:100%;background:#fff;font-weight:400;font-family:inherit}
.sectionTitle{margin:18px 0 8px;border-bottom:1px solid #e2e8e5;padding-bottom:6px}
.numGrid{display:grid;grid-template-columns:repeat(10,minmax(34px,1fr));gap:5px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.num{padding:8px 2px;border:1px solid #c7d1cc;border-radius:7px;background:#fff;font-weight:800}.num.on{background:var(--green);color:#fff;border-color:var(--green)}
.jerseys{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.jersey{min-width:56px;padding:10px;border:2px solid #c7d1cc;border-radius:10px;background:#fff;font-size:18px;font-weight:850}
.jersey small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.jersey.prior{border-color:var(--green);background:#e8f2ed}.jersey.used{opacity:.35}
.pick2,.pick3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick3{grid-template-columns:1fr 1fr 1fr}
.pick2 button,.pick3 button{padding:16px;border:1px solid #bdc9c3;border-radius:10px;background:#fff;font-weight:800}
.pick2 button.on{border:3px solid var(--green);background:#e8f2ed}.pick2 button:disabled{opacity:.4}
.lineupTeam{border:1px solid var(--line);border-radius:13px;padding:13px}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0}
.slot{padding:7px 2px;border:2px solid #c7d1cc;border-radius:9px;background:#fff;text-align:center;font-weight:800;font-size:15px}
.slot small{display:block;font-size:11px;color:var(--muted)}.slot.active{border-color:var(--green);background:#e8f2ed}
.colors{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.color{width:34px;height:34px;border-radius:9px;border:3px solid transparent}.color.on{border-color:#111;box-shadow:0 0 0 2px #fff inset}
.bigscore{font-size:56px;font-weight:850;text-align:center;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stats>div{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}

<body>
<div class="app">
 <header class="top"><div><div class="brand">Volleyball Scoresheet</div><div class="muted small">Live scoring • NCAA paper scoresheet • print or save as PDF</div></div><div class="pill" id="matchState">SETUP</div></header>
 <section class="card summary"><div id="matchSummary"></div><div class="btnrow"><button class="btn" onclick="meta&&openPregame(false)">Match Info</button><button class="btn" onclick="openBackup()">Backup</button><button class="btn" onclick="newMatch()">New Match</button></div></section>
 <div class="sets" id="sets"></div>
 <div class="status" id="status" aria-live="polite"></div>
 <div class="teams" id="teams"></div>
 <section class="card" style="margin-top:14px"><div class="toolbar" id="toolbar"></div><b>Match log</b> <span class="muted small">— newest first. Edit corrects an entry; the whole match is re-checked.</span><div class="log" id="log"></div></section>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =====================================================================
   Digital Volleyball Scoresheet — v22
   ---------------------------------------------------------------------
   Design: the match is stored as an ordered ACTION LOG (lineup, serve,
   rally, sub, libero, timeout, sanction, captain, note, confirmSet).
   The live state is always rebuilt by replaying that log through one
   rules engine (apply). That makes Undo exact, lets past entries be
   corrected safely (the whole match is re-checked), and gives the
   scoresheet a complete, consistent history to draw from.
   Sections:
     1. Constants & utilities      5. UI: main screen
     2. Rules engine               6. UI: dialogs & flows
     3. Storage & migration        7. Scoresheet renderer
     4. Commands (act/undo/edit)   8. Printing & startup
   ===================================================================== */

// ---------- 1. Constants & utilities ----------
const TEAMS=['A','B'];
const POS=['I','II','III','IV','V','VI'];      // rot[0]=I (server) … rot[5]=VI
const BACK_ROW=[0,4,5];                         // I, V, VI
const COURT_ORDER=[3,2,1,4,5,0];                // display: IV III II / V VI I
const TEAM_COLORS=['#0c6644','#1d4ed8','#dc2626','#7c3aed','#ea580c','#0891b2','#111827','#6b7280','#ca8a04','#db2777'];
const STORE_KEY='vbscoresheet.v22',OLD_KEY='vbscore16';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o));
const other=t=>t==='A'?'B':'A';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtClock=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
const fmtDur=ms=>{if(!ms||ms<0)return '—';const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const jerseyList=()=>['00',...Array.from({length:100},(_,i)=>String(i))];
const sortJerseys=a=>[...a].sort((x,y)=>(+x-+y)||x.length-y.length);

let meta=null;      // match information (teams, rosters, officials, rules)
let log=[];         // the action log — the single source of truth
let st=null;        // state derived by replaying the log
const ui={swapped:false,selLibero:null,sheetSet:1,draft:null,sub:null,pg:null,shownSwitchAt:null};

function defaultMeta(){return {date:todayISO(),time:'19:00',tourney:'',facility:'',city:'',division:'NAIA',visitor:'',home:'',
 colors:{A:'#0c6644',B:'#1d4ed8'},rosters:{A:[],B:[]},r1:'',r2:'',lj1:'',lj2:'',scorekeeper:'',
 setsToWin:3,timeoutsPerSet:2,subsAllowed:15,unlimitedSubs:false}}
function teamName(t,m=meta){return t==='MEDIA'?'Media':((t==='A'?m?.visitor:m?.home)||`Team ${t}`)}
function isDecidingSet(n,m=meta){return n===m.setsToWin*2-1}
function setTarget(n,m=meta){return isDecidingSet(n,m)?15:25}
function maxSets(m=meta){return m.setsToWin*2-1}

// ---------- 2. Rules engine ----------
class RuleError extends Error{}
const fail=msg=>{throw new RuleError(msg)};

function newMatchState(){return {set:1,phase:'lineup',setsWon:{A:0,B:0},setRecords:{},lineups:{},cur:null,pending:null,history:[],matchStart:null,matchEnd:null}}
function newSetState(L){
 const c={scores:{A:0,B:0},serving:L.firstServe,hasServed:{A:false,B:false},rot:{},slotIds:{},slotHistory:{},liberos:{},lib:{},counts:{},captain:{},verified:null,rally:0,start:null};
 c.hasServed[L.firstServe]=true;
 for(const t of TEAMS){
  c.rot[t]=[...L[t].rot];c.slotIds[t]=[0,1,2,3,4,5];c.slotHistory[t]={};
  L[t].rot.forEach((n,i)=>c.slotHistory[t][i]=[n]);
  c.liberos[t]={L1:L[t].liberos.L1||'',L2:L[t].liberos.L2||''};
  c.lib[t]={on:null,replaced:null,slot:null,lastExit:-99,serveSlot:null};
  c.counts[t]={to:0,subs:0};
  c.captain[t]={game:L[t].captain,floor:L[t].captain};
 }
 return c;
}
const scoreOf=c=>c?[c.scores.A,c.scores.B]:[0,0];
const liberoNums=(c,t)=>Object.values(c.liberos[t]).filter(Boolean);
function rotate(c,t){c.rot[t].push(c.rot[t].shift());c.slotIds[t].push(c.slotIds[t].shift())}
function expectedServer(c){const t=c.serving,L=c.lib[t],isLib=!!L.on&&c.slotIds[t][0]===L.slot;return {team:t,number:c.rot[t][0],libero:isLib?L.on:null,slot:c.slotIds[t][0],forPlayer:isLib?L.replaced:null}}
function liberoIndex(c,t){const L=c.lib[t];return L.on?c.slotIds[t].indexOf(L.slot):-1}
function frontRowLibero(c,t){const i=liberoIndex(c,t);return i>=0&&!BACK_ROW.includes(i)}
function fixCaptain(c,t){
 const C=c.captain[t],on=c.rot[t],libs=liberoNums(c,t);
 if(on.includes(C.game))C.floor=C.game;
 else if(!(C.floor&&on.includes(C.floor)&&!libs.includes(C.floor)))C.floor=null;
}
// Returns an error message, or null when the substitution is legal.
function subError(c,t,inP,outP,m){
 const tn=teamName(t,m),L=c.lib[t],libs=liberoNums(c,t);
 if(!m.unlimitedSubs&&c.counts[t].subs>=m.subsAllowed)return `${tn} has used all ${m.subsAllowed} substitutions this set.`;
 if(!(m.rosters[t]||[]).includes(inP))return `#${inP} is not on the ${tn} roster.`;
 if(libs.includes(inP)||libs.includes(outP))return 'Liberos are exchanged, not substituted. Use the libero buttons under the court.';
 if(L.on&&inP===L.replaced)return `#${inP} is off the court for the libero. Bring #${inP} back with a libero exchange first.`;
 if(c.rot[t].includes(inP))return `#${inP} is already on the court.`;
 const idx=c.rot[t].indexOf(outP);if(idx<0)return `#${outP} is not on the court.`;
 const slot=c.slotIds[t][idx];
 for(const [k,arr] of Object.entries(c.slotHistory[t]))if(+k!==slot&&arr.includes(inP))return `#${inP} already played in service position ${POS[k]} this set and may only return to that position.`;
 return null;
}
function liberoError(c,t,kind,replaces){
 const L=c.lib[t],num=c.liberos[t][kind];
 if(!num)return `No ${kind} is listed for ${teamName(t)}.`;
 if(L.on===kind)return null;                                    // exit
 if(L.on){const i=liberoIndex(c,t);return BACK_ROW.includes(i)?null:'A libero in the front row must be replaced by the regular player, not the other libero.'}
 const idx=c.rot[t].indexOf(replaces);
 if(idx<0)return `#${replaces} is not on the court.`;
 if(!BACK_ROW.includes(idx))return 'The libero may only replace a back-row player (positions I, V or VI).';
 const servingIn=t===c.serving&&idx===0;
 if(c.rally-L.lastExit<1&&!servingIn)return 'A completed rally must be played before the libero can return.';
 return null;
}
// The one place every action is checked and applied. Mutates st.
function apply(st,a,i,m){
 const H=x=>st.history.push({i,a,set:st.set,...x});
 const c=st.cur;
 if(a.type==='note'){H({score:scoreOf(c)});return}
 if(a.type==='lineup'){
  if(st.phase!=='lineup')fail('Lineups can only be entered before a set starts.');
  if(a.set!==st.set)fail(`These lineups are for set ${a.set}, but set ${st.set} is next.`);
  if(!TEAMS.includes(a.firstServe))fail('Choose which team serves first.');
  const L={firstServe:a.firstServe};
  for(const t of TEAMS){
   const d=a[t],tn=teamName(t,m),roster=m.rosters[t]||[];
   if(!d||d.rot.length!==6||d.rot.some(x=>!x))fail(`Enter all six starters for ${tn}.`);
   if(new Set(d.rot).size!==6)fail(`${tn} has a duplicate starter.`);
   for(const n of d.rot)if(!roster.includes(n))fail(`#${n} is not on the ${tn} roster.`);
   const l1=d.liberos?.L1||'',l2=d.liberos?.L2||'';
   for(const l of [l1,l2])if(l&&(!roster.includes(l)||d.rot.includes(l)))fail(`${tn}: a libero must be on the roster and not in the starting six.`);
   if(l1&&l1===l2)fail(`${tn}: L1 and L2 must be different players.`);
   if(!l1&&l2)fail(`${tn}: enter L1 before L2.`);
   if(!d.rot.includes(d.captain))fail(`Choose the ${tn} captain from the starting six.`);
   L[t]={rot:[...d.rot],liberos:{L1:l1,L2:l2},captain:d.captain};
  }
  st.lineups[st.set]=L;st.cur=newSetState(L);st.phase='live';H({score:[0,0]});return;
 }
 if(a.type==='confirmSet'){
  if(st.phase!=='setEnd')fail('There is no finished set waiting to be confirmed.');
  const p=st.pending;st.setRecords[p.set]={...p,signedAt:a.t||null};st.setsWon[p.w]++;
  H({score:[p.a,p.b],winner:p.w});st.pending=null;
  if(st.setsWon[p.w]>=m.setsToWin){st.phase='final';st.matchEnd=p.end;return}
  st.set++;st.phase='lineup';st.cur=null;return;
 }
 if(st.phase!=='live')fail(st.phase==='setEnd'?'The set is over — confirm the set score first.':st.phase==='final'?'The match is over.':'Enter the lineups first.');
 const preServe=()=>{if(c.verified)fail('That has to happen before the serve. Use Replay or record the rally first.')};
 const tm=t=>{if(!TEAMS.includes(t))fail('Choose a team.')};
 switch(a.type){
 case 'serve':{
  preServe();
  for(const t of TEAMS)if(frontRowLibero(c,t))fail(`${teamName(t,m)}: the libero has rotated to the front row. Bring #${c.lib[t].replaced} back in before the serve.`);
  const ex=expectedServer(c),L=c.lib[ex.team];
  if(ex.libero){
   if(L.serveSlot!==null&&L.serveSlot!==ex.slot)fail(`${teamName(ex.team,m)}: the libero already served for position ${POS[L.serveSlot]} this set and may serve in only one position. Bring #${ex.forPlayer} back in before this serve.`);
   L.serveSlot=ex.slot;
  }
  c.verified={...ex};
  if(!c.start){c.start=a.t||null;if(!st.matchStart)st.matchStart=a.t||null}
  H({score:scoreOf(c),team:ex.team,server:ex.number,libero:ex.libero,slot:ex.slot,forPlayer:ex.forPlayer});return;
 }
 case 'rally':{
  tm(a.winner);if(!c.verified)fail('Verify the server first (tap the SERVE BY button).');
  const v=c.verified;
  H({...awardPoint(st,c,a.winner,m,a.t),servingTeam:v.team,slot:v.slot,server:v.number,libero:v.libero});return;
 }
 case 'replay':{
  if(!c.verified)fail('A replay can only be recorded after the serve is verified.');
  const v=c.verified;c.verified=null;H({score:scoreOf(c),team:v.team,server:v.number,libero:v.libero,slot:v.slot});return;
 }
 case 'sub':{
  tm(a.team);preServe();const err=subError(c,a.team,a.in,a.out,m);if(err)fail(err);
  const t=a.team,idx=c.rot[t].indexOf(a.out),slot=c.slotIds[t][idx],isServing=t===c.serving;
  const line=isServing?c.slotIds[t][0]:(c.hasServed[t]?c.slotIds[t][1]:c.slotIds[t][0]);
  c.rot[t][idx]=a.in;const hist=c.slotHistory[t][slot];if(!hist.includes(a.in))hist.push(a.in);
  c.counts[t].subs++;fixCaptain(c,t);
  H({score:scoreOf(c),team:t,slot,line,isServing,count:c.counts[t].subs});return;
 }
 case 'libero':{
  tm(a.team);preServe();const t=a.team,L=c.lib[t];
  const err=liberoError(c,t,a.kind,a.replaces);if(err)fail(err);
  const num=c.liberos[t][a.kind];let what,player;
  if(!L.on){const idx=c.rot[t].indexOf(a.replaces);L.on=a.kind;L.replaced=a.replaces;L.slot=c.slotIds[t][idx];c.rot[t][idx]=num;what='in';player=a.replaces}
  else if(L.on===a.kind){const idx=liberoIndex(c,t);c.rot[t][idx]=L.replaced;what='out';player=L.replaced;L.on=null;L.replaced=null;L.slot=null;L.lastExit=c.rally}
  else{const idx=liberoIndex(c,t);what='switch';player=c.liberos[t][L.on];c.rot[t][idx]=num;L.on=a.kind}
  fixCaptain(c,t);H({score:scoreOf(c),team:t,kind:a.kind,num,what,player});return;
 }
 case 'timeout':{
  preServe();
  if(a.team==='MEDIA'){H({score:scoreOf(c)});return}
  tm(a.team);if(c.counts[a.team].to>=m.timeoutsPerSet)fail(`${teamName(a.team,m)} has no timeouts left this set.`);
  c.counts[a.team].to++;H({score:scoreOf(c),count:c.counts[a.team].to});return;
 }
 case 'captain':{
  tm(a.team);if(!c.rot[a.team].includes(a.player)||liberoNums(c,a.team).includes(a.player))fail(`#${a.player} is not an on-court, non-libero player.`);
  c.captain[a.team].floor=a.player;H({score:scoreOf(c)});return;
 }
 case 'sanction':{
  tm(a.team);if(!['IR','YC','RC'].includes(a.kind))fail('Choose a sanction.');
  const before=scoreOf(c);
  if(a.kind==='RC'){const servingTeam=c.serving,slot=c.slotIds[servingTeam][0];H({...awardPoint(st,c,other(a.team),m,a.t),scoreBefore:before,servingTeam,slot,penalty:true});}
  else H({score:before,scoreBefore:before});
  return;
 }
 default:fail(`Unknown entry type "${a.type}".`);
 }
}
function awardPoint(st,c,w,m,t){
 const sideOut=w!==c.serving;
 if(sideOut){if(c.hasServed[w])rotate(c,w);else c.hasServed[w]=true;c.serving=w}
 c.scores[w]++;c.rally++;c.verified=null;
 const A=c.scores.A,B=c.scores.B,tgt=setTarget(st.set,m);
 if((A>=tgt||B>=tgt)&&Math.abs(A-B)>=2){st.phase='setEnd';st.pending={set:st.set,a:A,b:B,w:A>B?'A':'B',start:c.start,end:t||null}}
 return {score:[A,B],winner:w,sideOut,newServerSlot:c.slotIds[c.serving][0]};
}
function replayLog(m,lg){
 const s=newMatchState();
 lg.forEach((a,i)=>{try{apply(s,a,i,m)}catch(e){if(e instanceof RuleError)e.index=i;throw e}});
 return s;
}

// ---------- 3. Storage & migration ----------
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({app:'vb-scoresheet',v:22,meta,log,ui:{swapped:ui.swapped}}))}catch(e){toast('Could not save on this device (storage full or blocked). Use Backup → Export to keep a copy.','error')}}
function loadSaved(){
 let raw=null;try{raw=localStorage.getItem(STORE_KEY)}catch(e){}
 if(raw){try{const d=JSON.parse(raw);meta={...defaultMeta(),...d.meta};log=d.log||[];ui.swapped=!!d.ui?.swapped;st=replayLog(meta,log);return}
  catch(e){console.error(e);try{localStorage.setItem(STORE_KEY+'.broken',raw)}catch(_){}meta=null;log=[];toast('The saved match could not be loaded; a copy was kept on this device.','error')}}
 let old=null;try{old=localStorage.getItem(OLD_KEY)}catch(e){}
 if(old){
  try{const o=JSON.parse(old);if(o.setupComplete){const conv=migrateV20(o);st=replayLog(conv.meta,conv.log);meta=conv.meta;log=conv.log;save();toast('Your saved match was upgraded to the new version.')}}
  catch(e){console.error(e);toast('A match saved by an older version could not be upgraded. A backup copy was kept.','error');meta=null;log=[]}
  try{localStorage.setItem(OLD_KEY+'.backup',old);localStorage.removeItem(OLD_KEY)}catch(e){}
 }
}
// Converts the v15–v21 snapshot format into the action log.
function migrateV20(o){
 const om=o.meta||{},m={...defaultMeta(),...om,setsToWin:om.matchType||om.setsToWin||3,rosters:{A:[...(om.rosters?.A||[])],B:[...(om.rosters?.B||[])]},colors:om.colors||defaultMeta().colors};
 delete m.matchType;
 const names=[['A',m.visitor],['B',m.home]].sort((x,y)=>(y[1]||'').length-(x[1]||'').length);
 const teamOf=txt=>{for(const [t,n] of names)if(n&&txt.startsWith(n))return t;return null};
 const recs=o.setRecords||{},lg=[];let set=1,prev=[0,0],firstServe=true;
 const parse=x=>{const mm=String(x||'').match(/(\d+)\s*-\s*(\d+)/);return mm?[+mm[1],+mm[2]]:[0,0]};
 for(const e of o.events||[]){
  const txt=e.text||'';
  switch(e.type){
   case 'LINEUP':{set=e.set||set;const L=o.lineups?.[set];if(!L)break;
    let fs=L.firstServe;if(!fs){const mm=/•\s*(.+) serves first/.exec(txt);fs=mm&&mm[1]===m.home?'B':'A'}
    lg.push({type:'lineup',set,A:{rot:L.A.rot,liberos:L.A.liberos||{},captain:L.A.captain},B:{rot:L.B.rot,liberos:L.B.liberos||{},captain:L.B.captain},firstServe:fs,t:null});prev=[0,0];firstServe=true;break}
   case 'SERVER':lg.push({type:'serve',t:firstServe?(recs[set]?.start||null):null});firstServe=false;break;
   case 'POINT':{const sc=parse(e.score),w=e.pointTeam||(sc[0]>prev[0]?'A':'B');prev=sc;const r=recs[set];lg.push({type:'rally',winner:w,t:r&&sc[0]===+r.a&&sc[1]===+r.b?r.end:null});break}
   case 'REPLAY':lg.push({type:'replay'});break;
   case 'SUBSTITUTION':{let t=e.team,inP=e.inPlayer,outP=e.outPlayer;if(!t){const mm=/•\s*(.+?)\s*•\s*#(\S+) IN \/ #(\S+) OUT/.exec(txt);if(mm){t=mm[1]===m.home?'B':'A';inP=mm[2];outP=mm[3]}}if(t)lg.push({type:'sub',team:t,in:inP,out:outP});break}
   case 'LIBERO':{const t=teamOf(txt);if(!t)break;const rest=txt.slice((t==='A'?m.visitor:m.home).length).trim();let mm;
    if((mm=/^(L[12]) #\S+ replaces (L[12]) directly/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1]});
    else if((mm=/^(L[12]) #\S+ replaces #(\S+)/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1],replaces:mm[2]});
    else if((mm=/^#\S+ returns for (L[12])/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1]});
    break}
   case 'TIMEOUT':{let t=e.team;if(!t)t=/Media/.test(txt)?'MEDIA':(txt.includes(m.home)?'B':'A');lg.push({type:'timeout',team:t});break}
   case 'NOTE':lg.push({type:'note',text:txt});break;
   case 'SET':lg.push({type:'confirmSet',t:recs[set]?.signedAt||null});set++;break;
  }
 }
 return {meta:m,log:lg};
}

// ---------- 4. Commands ----------
// Every user action goes through act(): it is checked by the rules engine before it is kept.
function act(a){
 if(!meta)return false;
 const entry={...a,t:a.t??Date.now()},next=clone(st);
 try{apply(next,entry,log.length,meta)}
 catch(e){if(e instanceof RuleError){toast(e.message,'error');return false}throw e}
 log.push(entry);st=next;save();render();afterChange();return true;
}
// Replace the log (used by undo / corrections). The whole match is re-checked first.
function replaceLog(newLog,okMsg){
 try{const s=replayLog(meta,newLog);log=newLog;st=s;save();render();if(okMsg)toast(okMsg);afterChange();return true}
 catch(e){if(e instanceof RuleError){const h=st.history.find(x=>x.i===e.index);toast(`That change conflicts with a later entry${h?` (set ${h.set}, ${h.score.join('-')})`:''}: ${e.message}`,'error');return false}throw e}
}
function undo(){
 if(!log.length)return;
 const last=log[log.length-1];
 const doIt=()=>{closeModal(true);ui.selLibero=null;replaceLog(log.slice(0,-1),'Undone: '+describe(st.history[st.history.length-1]))};
 if(last.type==='confirmSet'||last.type==='lineup')confirmDialog(last.type==='confirmSet'?`Undo the signed confirmation of set ${st.history[st.history.length-1].set}?`:`Undo the set ${last.set} lineups?`,'Undo',doIt);
 else doIt();
}
function editLog(i,fn,msg){const nl=clone(log);fn(nl);if(replaceLog(nl,msg))closeModal(true)}

// ---------- 5. UI: main screen ----------

function render(){

 $('status').textContent=st.phase==='final'?`FINAL — ${teamName(sw.A>sw.B?'A':'B')} wins ${Math.max(sw.A,sw.B)}-${Math.min(sw.A,sw.B)}`:

 $('teams').innerHTML=order.map(teamCard).join('');

 const tb=[['Substitution','openSub()',pre],['Timeout','openTimeout()',pre],['Sanction','openSanction()',live],['Note','openNote()',true],['Replay','replayRally()',live&&!!st.cur.verified],['Switch Sides','swapSides()',true],['Scoresheet','openScoresheet()',true],['Undo','undo()',log.length>0]];
 $('toolbar').innerHTML=tb.map(([l,f,on])=>`<button class="btn ${l==='Scoresheet'?'primary':''}" onclick="${f}" ${on?'':'disabled'}>${l}</button>`).join('');
 $('log').innerHTML=[...st.history].reverse().map(h=>`<div class="event"><b>${h.score?h.score.join('-'):''}</b><span>${esc(describe(h))}${h.a.edited?' <span class="badge">EDITED</span>':''}<small>Set ${h.set} • ${fmtClock(h.a.t)}</small></span>${EDITABLE.includes(h.a.type)?`<button class="edit" onclick="openEdit(${h.i})">Edit</button>`:'<span></span>'}</div>`).join('')||'<div class="event"><span></span><span class="muted">No entries yet.</span></div>';
}
function teamCard(t){
 const c=st.cur,color=meta.colors[t],live=st.phase==='live';
 const score=c?c.scores[t]:0;
 const to=c?c.counts[t].to:0,subs=c?c.counts[t].subs:0;
 const subLeft=meta.unlimitedSubs?'∞':Math.max(0,meta.subsAllowed-subs);
 let btn='<button class="point" disabled>POINT</button>';
 if(live&&!c.verified&&c.serving===t){const ex=expectedServer(c);btn=`<button class="point verify" onclick="verifyServe()">SERVE BY ${ex.libero?ex.libero+' ':''}#${esc(ex.number)}</button>`}
 else if(live&&c.verified)btn=`<button class="point" onclick="act({type:'rally',winner:'${t}'})">+ POINT</button>`;
 let court='',bench='',line='';
 if(c){
  const L=c.lib[t],sel=ui.selLibero?.team===t&&canPreServe();
  court=COURT_ORDER.map(i=>{const n=c.rot[t][i],isLib=L.on&&c.slotIds[t][i]===L.slot,cap=c.captain[t].floor===n,target=sel&&BACK_ROW.includes(i);
   return `<div class="pos ${isLib?'lib':''} ${target?'target':''}" ${target?`onclick="liberoTap('${t}',${i})" role="button" tabindex="0"`:''}><small>${POS[i]}${c.serving===t&&i===0?' • serve':''}</small><b>#${esc(n)}</b>${isLib?'<span class="badge l">L</span>':''}${cap?'<span class="badge">C</span>':''}</div>`}).join('');
  if(canPreServe()){
   for(const k of ['L1','L2']){const num=c.liberos[t][k];if(!num)continue;
    if(L.on===k)bench+=`<button class="libBtn return" onclick="act({type:'libero',team:'${t}',kind:'${k}'})">#${esc(L.replaced)} back in for ${k}</button>`;
    else if(L.on)bench+=`<button class="libBtn" onclick="act({type:'libero',team:'${t}',kind:'${k}'})">${k} #${esc(num)} for ${L.on}</button>`;
    else bench+=`<button class="libBtn ${ui.selLibero?.team===t&&ui.selLibero.kind===k?'selected':''}" onclick="selectLibero('${t}','${k}')">${k} #${esc(num)}</button>`;}
  }
  if(sel)bench+=`<div class="hint" style="width:100%">Tap a back-row player for ${ui.selLibero.kind} to replace</div>`;
  if(frontRowLibero(c,t))bench+=`<div class="warning" style="width:100%"><b>Libero in the front row.</b> Bring #${esc(L.replaced)} back before the serve.</div>`;
  if(c.serving===t&&live){const v=c.verified;line=v?`● Serve verified — ${v.libero?v.libero+' ':''}#${esc(v.number)}`:'● Serving — verify the server'}
 }
 return `<section class="card team" style="--team:${color}"><h2>${esc(teamName(t))}</h2>
 <div class="chips"><span class="chip">Sets ${st.setsWon[t]}</span><span class="chip">TO ${to} used / ${Math.max(0,meta.timeoutsPerSet-to)} left</span><span class="chip">Subs ${subs} used / ${subLeft} left</span></div>
 <div class="score">${score}</div>${btn}${c?`<div class="court">${court}</div><div class="bench">${bench}</div>`:''}<div class="serveLine">${line}</div></section>`;
}
function describe(h){
 const a=h.a,tn=t=>teamName(t);
 switch(a.type){
  case 'lineup':return `Set ${a.set} lineups verified — ${tn(a.firstServe)} serves first`;
  case 'serve':return `${tn(h.team)} serve: ${h.libero?h.libero+' ':''}#${h.server}${h.forPlayer?` (for #${h.forPlayer})`:''}`;
  case 'rally':return `Point ${tn(a.winner)}${h.sideOut?' — side out':''}`;
  case 'replay':return `Replay — #${h.server} serves again`;
  case 'sub':return `${tn(a.team)}: #${a.in} in for #${a.out} (sub ${h.count})`;
  case 'libero':return h.what==='in'?`${tn(a.team)}: ${a.kind} #${h.num} in for #${h.player}`:h.what==='out'?`${tn(a.team)}: #${h.player} back in for ${a.kind}`:`${tn(a.team)}: ${a.kind} #${h.num} replaces the other libero`;
  case 'timeout':return a.team==='MEDIA'?'Media timeout':`Timeout ${tn(a.team)} (${h.count} of ${meta.timeoutsPerSet})`;
  case 'captain':return `${tn(a.team)}: floor captain #${a.player}`;
  case 'sanction':return `${{IR:'Improper request',YC:'Yellow card',RC:'Red card'}[a.kind]} — ${tn(a.team)}${a.who?' '+(/^\d/.test(a.who)?'#'+a.who:a.who):''}${a.kind==='RC'?` • point ${tn(other(a.team))}`:''}`;
  case 'note':return `Note: ${a.text}`;
  case 'confirmSet':return `Set ${h.set} confirmed & signed — ${tn(h.winner)} ${Math.max(...h.score)}-${Math.min(...h.score)}`;
 }
 return a.type;
}
const EDITABLE=['rally','timeout','sub','note','sanction','replay'];
function fmtSched(t){const [h,m]=t.split(':').map(Number);return isFinite(h)?`${h%12||12}:${String(m||0).padStart(2,'0')} ${h>=12?'PM':'AM'}`:t}
function verifyServe(){
 const c=st.cur;for(const t of TEAMS)if(!c.captain[t].floor){openCaptainPicker(t);return}
 act({type:'serve'});
}
function replayRally(){act({type:'replay'})}
function swapSides(){ui.swapped=!ui.swapped;save();render()}
function selectLibero(t,k){ui.selLibero=ui.selLibero?.team===t&&ui.selLibero.kind===k?null:{team:t,kind:k};render()}
function liberoTap(t,i){const k=ui.selLibero.kind;ui.selLibero=null;act({type:'libero',team:t,kind:k,replaces:st.cur.rot[t][i]})}
// Opens whatever the match needs next (set confirmation, lineups, captain choice, side switch).
function afterChange(){
 if(!meta||modalOpen())return;
 if(st.phase==='setEnd')return openSetConfirm();
 if(st.phase==='lineup')return openLineups();
 if(st.phase==='live'){
  for(const t of TEAMS)if(!st.cur.captain[t].floor)return openCaptainPicker(t);
  const h=st.history[st.history.length-1];
  if(h&&isDecidingSet(h.set)&&h.winner&&h.score&&Math.max(...h.score)===8&&Math.min(...h.score)<8&&h.score[h.winner==='A'?0:1]===8&&ui.shownSwitchAt!==h.i){
   ui.shownSwitchAt=h.i;
   return dialog(`<h2>Switch sides</h2><p>${esc(teamName(h.winner))} reached 8 in the deciding set — teams change courts.</p>`,[['Not now','closeModal()'],['Switch sides','swapSides();closeModal()','primary']]);
  }
 }
 if(st.phase==='final'&&ui.shownFinal!==log.length){ui.shownFinal=log.length;const w=st.setsWon.A>st.setsWon.B?'A':'B';
  return dialog(`<h2>Match complete</h2><div class="bigscore">${st.setsWon.A} - ${st.setsWon.B}</div><p style="text-align:center"><b>${esc(teamName(w))}</b> wins the match.</p>`,[['Close','closeModal()'],['View & print scoresheet','closeModal(true);openScoresheet()','primary']]);}
}

// --- Substitutions ---
function openSub(team){
 if(!canPreServe())return;
 if(!team)return showModal(`<h2>Substitution</h2><p class="muted">Which team is substituting?</p><div class="pick2">${TEAMS.map(t=>`<button onclick="openSub('${t}')">${esc(teamName(t))}<br><span class="muted small">${meta.unlimitedSubs?'unlimited':`${meta.subsAllowed-st.cur.counts[t].subs} left`}</span></button>`).join('')}</div>`);
 const c=st.cur,ins=(meta.rosters[team]||[]).filter(n=>c.rot[team].some(o=>!subError(c,team,n,o,meta)));
 const appeared=new Set(Object.values(c.slotHistory[team]).flat());
 const L=c.lib[team];
 const capMsg=!meta.unlimitedSubs&&c.counts[team].subs>=meta.subsAllowed?`<div class="warning">${esc(teamName(team))} has used all ${meta.subsAllowed} substitutions.</div>`:'';
 showModal(`<h2>${esc(teamName(team))} — player IN</h2>${capMsg}${L.on?`<div class="warning">${L.on} is on the court for #${esc(L.replaced)}. Bring #${esc(L.replaced)} back with a libero exchange before substituting in that position.</div>`:''}
 <p class="muted">Highlighted players have already played this set and can only return to their position.</p>
 <div class="jerseys">${ins.map(n=>`<button class="jersey ${appeared.has(n)?'prior':''}" onclick="subPickIn('${team}','${n}')">#${n}</button>`).join('')||'<span class="muted">No eligible players.</span>'}</div>
 <div class="actions"><button class="btn left" onclick="openSub()">Back</button><button class="btn" onclick="closeModal()">Done</button></div>`);
}
function subPickIn(t,n){
 const c=st.cur,outs=c.rot[t].map((o,i)=>({o,i})).filter(x=>!subError(c,t,n,x.o,meta));
 showModal(`<h2>${esc(teamName(t))} — #${n} IN</h2><p class="muted">Who is coming OUT?</p><div class="jerseys">${outs.map(x=>`<button class="jersey" onclick="subDo('${t}','${n}','${x.o}')">#${x.o}<small>${POS[x.i]}</small></button>`).join('')}</div><div class="actions"><button class="btn left" onclick="openSub('${t}')">Back</button></div>`);
}
function subDo(t,inP,outP){
 if(!act({type:'sub',team:t,in:inP,out:outP}))return;
 const left=meta.unlimitedSubs?'unlimited':`${meta.subsAllowed-st.cur.counts[t].subs} left`;
 showModal(`<h2>Substitution recorded</h2><p><b>${esc(teamName(t))}</b>: #${inP} in for #${outP} <span class="muted">(${left})</span></p><div class="actions"><button class="btn left" onclick="openSub('${t}')">Another ${esc(teamName(t))} sub</button><button class="btn" onclick="openSub('${other(t)}')">${esc(teamName(other(t)))} sub</button><button class="btn primary" onclick="closeModal()">Subs complete</button></div>`);
}

 const del=`<button class="btn danger left" onclick="editLog(${i},l=>l.splice(${i},1),'Entry removed.')">Delete entry</button>`;
 if(a.type==='rally')return dialog(head,[['Cancel','closeModal()'],[`Point goes to ${esc(teamName(other(a.winner)))} instead`,`editLog(${i},l=>{l[${i}].winner='${other(a.winner)}';l[${i}].edited=true},'Rally corrected.')`,'primary']]);

 if(a.type==='sub'){const r=meta.rosters[a.team];const o=(id,v)=>`<select class="field" id="${id}">${r.map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}</select>`;
  return showModal(head+`<div class="grid2"><label>Player IN${o('ed-in',a.in)}</label><label>Player OUT${o('ed-out',a.out)}</label></div><div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="editLog(${i},l=>{l[${i}].in=$('ed-in').value;l[${i}].out=$('ed-out').value;l[${i}].edited=true},'Substitution corrected.')">Save</button></div>`)}
 if(a.type==='note')return showModal(head+`<textarea class="field" id="ed-note" rows="3">${esc(a.text)}</textarea><div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="editLog(${i},l=>{l[${i}].text=$('ed-note').value.trim()||l[${i}].text;l[${i}].edited=true},'Note updated.')">Save</button></div>`);

function importMatch(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);let m,l;
   if(d.app==='vb-scoresheet'){m={...defaultMeta(),...d.meta};l=d.log||[]}else if(d.setupComplete){({meta:m,log:l}=migrateV20(d))}else throw new Error('Not a scoresheet file.');
   const s=replayLog(m,l);
   const go=()=>{meta=m;log=l;st=s;ui.draft=null;save();closeModal();render();toast('Match imported.')};
   if(meta&&log.length)confirmDialog('Replace the match on this device with the imported one?','Replace',go);else go();
  }catch(e){toast('Could not import that file: '+e.message,'error')}};
 r.readAsText(file);
}

function hstr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function jit(key,amp){return((hstr(key)%10007)/10007-.5)*2*amp}
class SheetInk{
 constructor(seed){this.o=[];this.seed=String(seed);this.n=0}
 k(){return this.seed+'|'+(this.n++)}
 text(x,y,str,o={}){
  if(str===null||str===undefined||str==='')return;
  const k=this.k(),rot=o.rot??jit(k+'r',o.tilt??2),dx=jit(k+'x',1),dy=jit(k+'y',1);
  this.o.push(`<text x="${(x+dx).toFixed(1)}" y="${(y+dy).toFixed(1)}" font-size="${o.size||18}" text-anchor="${o.anchor||'start'}" class="${o.cls||'hw'}" transform="rotate(${rot.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})">${esc(str)}</text>`);
 }
 ctext(x,y,str,size=16,o={}){this.text(x,y+size*.36,str,{anchor:'middle',size,...o})}
 path(d,w){this.o.push(`<path class="pen" d="${d}"${w?` style="stroke-width:${w}"`:''}/>`)}
 loop(cx,cy,rx,ry){
  const k=this.k(),a0=jit(k+'a',3.1)+3.1,over=.12+Math.abs(jit(k+'o',.1)),N=26,tilt=jit(k+'t',.25),pts=[];
  for(let i=0;i<=N;i++){const a=a0+i/N*(Math.PI*2+over),w=1+jit(k+'w'+i,.035),x=Math.cos(a)*rx*w,y=Math.sin(a)*ry*w;
   pts.push([cx+x*Math.cos(tilt)-y*Math.sin(tilt),cy+x*Math.sin(tilt)+y*Math.cos(tilt)])}
  this.path('M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'));
 }
 tri(cx,cy,h,w){const k=this.k(),j=n=>jit(k+n,1.3),A=[cx+j('a'),cy-h*.62],B=[cx-w/2+j('b'),cy+h*.42+j('c')],C=[cx+w/2+j('d'),cy+h*.42+j('e')];
  this.path(`M${A[0].toFixed(1)} ${A[1].toFixed(1)} L${B[0].toFixed(1)} ${B[1].toFixed(1)} L${C[0].toFixed(1)} ${C[1].toFixed(1)} L${(A[0]+1.5).toFixed(1)} ${(A[1]+1).toFixed(1)}`)}
 line(x1,y1,x2,y2,w){const k=this.k(),f=v=>v.toFixed(1);this.path(`M${f(x1+jit(k+'1',1))} ${f(y1+jit(k+'2',1))} Q${f((x1+x2)/2+jit(k+'3',1.5))} ${f((y1+y2)/2+jit(k+'4',1.5))} ${f(x2+jit(k+'5',1))} ${f(y2+jit(k+'6',1))}`,w)}
 slash(cx,cy,sz=9){this.line(cx-sz*.75,cy+sz,cx+sz*.75,cy-sz)}
 svg(){return this.o.join('')}
}
function sheetSetsAvailable(){const a=Object.keys(st?.lineups||{}).map(Number).sort((x,y)=>x-y);return a.length?a:[st?.set||1]}
function buildSetModel(n){
 const L=st.lineups[n],H=st.history.filter(h=>h.set===n);
 const M={n,L,first:L?.firstServe,rows:{A:[[],[],[],[],[],[]],B:[[],[],[],[],[],[]]},players:{A:[],B:[]},run:{A:{},B:{}},subs:{A:0,B:0},tos:{A:[],B:[]},sanctions:[],comments:[],final:[0,0]};
 if(!L)return M;
 for(const t of TEAMS)for(let i=0;i<6;i++)M.players[t][i]=[{num:L[t].rot[i],cap:L[t].captain===L[t].rot[i]}];
 const own=(t,sc)=>t==='A'?sc[0]:sc[1],opp=(t,sc)=>t==='A'?sc[1]:sc[0];
 const push=(t,row,tok)=>M.rows[t][row].push(tok);
 const newTerm=(t,row,p)=>{if(M.rows[t][row].length)push(t,row,{k:'gap'});push(t,row,{k:'pt',t:String(p)})};
 for(const h of H){
  const a=h.a;
  if(a.type==='rally'||(a.type==='sanction'&&a.kind==='RC')){
   const w=h.winner,sv=h.servingTeam,p=own(w,h.score);M.final=h.score;
   if(a.type==='rally'){const shape=h.libero?'t':'c';
    if(!h.sideOut){push(sv,h.slot,{k:'srv',shape,t:String(p)});M.run[w][p]=shape}
    else{push(sv,h.slot,{k:'srv',shape,t:'R'});M.run[w][p]='slash';newTerm(w,h.newServerSlot,p)}}
   else{M.run[w][p]='slash';if(h.sideOut)newTerm(w,h.newServerSlot,p);else push(sv,h.slot,{k:'pt',t:String(p)})}
  }
  if(a.type==='sanction')M.sanctions.push({team:a.team,kind:a.kind,who:a.who,score:`${own(a.team,h.scoreBefore)}-${opp(a.team,h.scoreBefore)}`});
  else if(a.type==='sub'){push(a.team,h.line,{k:'sub',t:`S${h.isServing?'':'x'}${a.in}/${a.out}`});M.players[a.team][h.slot].push({num:a.in,score:`${own(a.team,h.score)}-${opp(a.team,h.score)}`});M.subs[a.team]++}
  else if(a.type==='timeout'){if(a.team==='MEDIA')M.comments.push(`Media T.O. at ${h.score.join('-')}`);else M.tos[a.team].push([own(a.team,h.score),opp(a.team,h.score)])}
  else if(a.type==='replay')M.comments.push(`Replay at ${h.score.join('-')}, #${h.server} re-served`);
  else if(a.type==='note')M.comments.push(`${h.score.join('-')}: ${a.text}`);
 }
 const rec=st.setRecords[n]||(st.pending?.set===n?st.pending:null);
 M.complete=!!st.setRecords[n];M.start=rec?.start||(n===st.set&&st.cur?st.cur.start:null);M.end=rec?.end||null;
 if(rec)M.final=[+rec.a,+rec.b];
 if(isDecidingSet(n))M.comments.unshift('Deciding set to 15');
 if(M.complete&&st.phase==='final'&&n===Math.max(...Object.keys(st.setRecords).map(Number))){const sw=st.setsWon,w=sw.A>sw.B?'A':'B';M.comments.push(`MATCH: ${teamName(w)} wins ${Math.max(sw.A,sw.B)}-${Math.min(sw.A,sw.B)}`)}
 for(const t of TEAMS){const extra=Object.keys(M.run[t]).map(Number).filter(p=>p>32).sort((a,b)=>a-b);if(extra.length)M.comments.push(`Team ${t} score cont.: ${extra.join(', ')}`)}
 return M;
}
function timeParts(v){if(!v)return null;const d=new Date(v);if(isNaN(d))return null;const h=d.getHours();return{h:String(h%12||12),m:String(d.getMinutes()).padStart(2,'0'),pm:h>=12}}
function schedParts(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return isFinite(h)?{h:String(h%12||12),m:String(m||0).padStart(2,'0'),pm:h>=12}:null}
function drawTime(ink,p,y){if(!p)return;ink.text(1479,y+7,p.h,{anchor:'end',size:19});ink.text(1495,y+7,p.m,{size:19});ink.loop(p.pm?1615:1557,y,21,11)}
function wrapText(s,max){const out=[];let cur='';for(const w of String(s).split(/\s+/)){if((cur+' '+w).trim().length>max){if(cur)out.push(cur);cur=w}else cur=(cur+' '+w).trim()}if(cur)out.push(cur);return out}
function drawServiceRow(ink,t,row,tokens){
 const [x0,x1]=F.svc[t],top=F.rowTop[row],bot=F.rowBot[row],mid=(top+bot)/2,ys=[(top+mid)/2+1,(mid+bot)/2];
 const W=k=>k.k==='gap'?11:k.k==='srv'?30:k.k==='pt'?(k.t.length>1?25:17):k.t.length*8.6+10;
 const total=tokens.reduce((s,k)=>s+W(k),0),cap=(x1-x0)*2-20,sc=total>cap?cap/total:1;
 let x=x0,line=0;
 for(const k of tokens){
  const w=W(k)*sc;if(x+w>x1&&line===0){line=1;x=x0}
  if(k.k==='gap'){if(x>x0)x+=w;continue}
  const cx=x+w/2,cy=ys[line],two=k.t.length>1;
  if(k.k==='srv'){if(k.shape==='t'){ink.tri(cx,cy,30*sc,29*sc);ink.ctext(cx,cy+3*sc,k.t,(two?12:14)*sc,{tilt:1})}else{ink.loop(cx,cy,12.5*sc,12*sc);ink.ctext(cx,cy,k.t,(two?14:16)*sc,{tilt:1.5})}}
  else if(k.k==='pt')ink.ctext(cx,cy,k.t,18*sc);
  else ink.ctext(cx,cy,k.t,16*sc,{tilt:1});
  x+=w;
 }
}
function drawPlayers(ink,t,row,entries){
 const [x0]=F.pcol[t],top=F.rowTop[row],bot=F.rowBot[row],mid=(top+bot)/2,ys=[(top+mid)/2+1,(mid+bot)/2],cur=[x0+10,x0+10];
 entries.forEach((en,i)=>{
  if(!en.num)return;const line=i===0?0:i%2===1?1:0,y=ys[line],x=cur[line];
  ink.text(x,y+7,en.num,{size:i===0?22:20});let w=String(en.num).length*11+4;
  if(en.cap){ink.loop(x+w/2-2,y,w/2+5,14);w+=6}
  if(en.score){ink.text(x+w,y+11,en.score,{size:11,tilt:1});w+=en.score.length*6+8}
  cur[line]=x+w+6;
 });
}
function sheetSVG(n){
 const M=buildSetModel(n),m=meta,ink=new SheetInk('set'+n+(m.date||''));
 ink.text(662,115,m.tourney,{size:20});
 const place=[m.facility,m.city].filter(Boolean).join(', ');ink.text(650,151,place,{size:place.length>42?16:20});
 ink.text(668,187,m.division,{size:20});
 ink.text(650,220,`${teamName('A')} at ${teamName('B')}`,{size:20});
 if(m.date){const d=new Date(m.date+'T12:00:00');if(!isNaN(d)){ink.text(1176,115,`${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`,{size:20});ink.loop(F.day[d.getDay()],107,[0,4,6].includes(d.getDay())?15:12,11)}}
 drawTime(ink,schedParts(m.time),144);drawTime(ink,timeParts(M.start),180);if(M.end)drawTime(ink,timeParts(M.end),216);
 if(M.L){
  for(const t of TEAMS){
   ink.text(F.team[t][0],F.team[t][1],teamName(t),{size:25,cls:'hwb',tilt:1});
   const lb=M.L[t].liberos;if(lb.L1)ink.ctext(F.lib[t].L1,F.lib.y,lb.L1,16);if(lb.L2)ink.ctext(F.lib[t].L2,F.lib.y,lb.L2,16);
   for(let i=0;i<6;i++){drawPlayers(ink,t,i,M.players[t][i]);drawServiceRow(ink,t,i,M.rows[t][i])}
   const x=F.run.x[t];
   for(const [p,mk] of Object.entries(M.run[t])){if(+p>32)continue;const y=F.run.y(+p);if(mk==='c')ink.loop(x,y,12,11.5);else if(mk==='t')ink.tri(x,y+2,30,28);else ink.slash(x,y,10)}
   if(M.complete){const last=t==='A'?M.final[0]:M.final[1];if(last<32)ink.line(x,F.run.y(last+1)-11,x+jit('end'+t+n,2),F.run.y(32)+10,2.2)}
   for(let i=0;i<Math.min(15,M.subs[t]);i++){const [sx,sy]=F.subs[t][i];ink.slash(sx,sy,9)}
   M.tos[t].slice(0,2).forEach((v,i)=>{const [xs,ys]=F.to[t];ink.ctext(xs[0],ys[i],String(v[0]),15,{tilt:2});ink.ctext(xs[1],ys[i],String(v[1]),15,{tilt:2})});
  }
  const fs=F.sBox[M.first];ink.loop(fs[0],fs[1],13,11);
 }
 M.sanctions.slice(0,5).forEach((s,i)=>{const y=F.sanc.rows[i];
  if(s.kind==='IR')ink.loop(F.sanc.IR,y,18,13);else ink.ctext(F.sanc[s.kind],y,s.who==='Coach'?'C':s.who==='Team'?'T':s.who,18);
  ink.ctext(F.sanc.AB,y,s.team,18);ink.ctext(F.sanc.SCORE,y,s.score,18)});
 if(M.sanctions.length>5)M.comments.push(`${M.sanctions.length-5} more sanction(s) in the match log`);
 let cy=932;for(const c of M.comments){for(const ln of wrapText(c,27)){if(cy>1225)break;ink.text(588,cy,ln,{size:16,tilt:.8});cy+=24}}
 ink.text(1062,893,m.r1,{size:21});ink.text(1086,941,m.r2,{size:21});ink.text(1188,989,m.scorekeeper,{size:20});
 if(M.complete&&m.scorekeeper)ink.text(1190,1040,m.scorekeeper,{cls:'sig',size:36,tilt:1.5});
 ink.text(182,1182,m.lj1,{size:20});ink.text(182,1229,m.lj2,{size:20});
 if(F.setNo[n-1])ink.loop(F.setNo[n-1],1125,10,14);
 if(M.complete){const [a,b]=M.final,w=a>b?'A':'B';
  ink.text(1082,1172,teamName(w),{size:23});ink.ctext(1605,1164,String(Math.max(a,b)),24);
  ink.text(1082,1219,teamName(other(w)),{size:23});ink.ctext(1605,1212,String(Math.min(a,b)),24)}
 return `<svg class="ncaaSvg" viewBox="0 0 1760 1360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NCAA volleyball scoresheet, set ${n}"><image href="scoresheet-bg.png" x="0" y="0" width="1760" height="1360"/><g class="ink">${ink.svg()}</g></svg>`;
}

// ---------- 8. Viewer, printing & startup ----------
function openScoresheet(){
 if(!meta)return;const sets=sheetSetsAvailable();
 if(!sets.includes(ui.sheetSet))ui.sheetSet=sets[sets.length-1];
 showModal(`<div class="sheetTabs">${sets.map(n=>`<button class="btn ${n===ui.sheetSet?'on':''}" onclick="ui.sheetSet=${n};openScoresheet()">Set ${n}</button>`).join('')}<span style="flex:1"></span><button class="btn" onclick="printSheets([ui.sheetSet])">Print this set</button><button class="btn primary" onclick="printSheets(sheetSetsAvailable())">Print all sets (${sets.length})</button></div>
 ${sheetSVG(ui.sheetSet)}<div class="sheetLegend">Circle = point on serve • triangle = libero serve • R = serve lost (rotate) • plain number = point earned on rotation • S in/out = substitution (Sx = receiving team). To save a PDF, choose “Save as PDF” in the print window.</div>`,{wide:true});
}
function printSheets(sets){
 const pa=$('printArea');pa.innerHTML=sets.map(n=>`<div class="printPage">${sheetSVG(n)}</div>`).join('');
 const img=new Image();img.src='scoresheet-bg.png';
 const go=()=>setTimeout(()=>window.print(),120);
 Promise.all([document.fonts?document.fonts.ready:0,img.decode?img.decode().catch(()=>0):0]).then(go,go);
}
window.addEventListener('afterprint',()=>{$('printArea').innerHTML=''});
(function start(){
 try{document.fonts.load('20px Kalam');document.fonts.load('bold 20px Kalam');document.fonts.load('30px "Mrs Saint Delafield"')}catch(e){}
 new Image().src='scoresheet-bg.png';
 loadSaved();if(st?.phase==='final')ui.shownFinal=log.length;render();
 if(!meta)openPregame(true);else afterChange();
})();

</script>
