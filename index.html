:root{
 --paper:#f4f6f8;--surface:#fff;--ink:#17202c;--ink2:#3a4656;--muted:#677487;
 --rule:#dbe1e8;--rule2:#c4ccd7;--pen:#1f3f8f;--pen-soft:#e9eef9;
 --warn-bg:#fff7e6;--warn-line:#efd39a;--danger:#a3261e;--ok-bg:#edf6ee;--ok-line:#b9dbbb;
 --f:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',sans-serif;--r:4px;
 font-family:var(--f);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.35}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:14px}
.help{font-size:14px;color:var(--muted);font-weight:400;margin:4px 0 0}

/* ---- App bar ---- */
.appbar{background:var(--surface);border-bottom:1px solid var(--rule)}
.appbar-in{max-width:1200px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;color:var(--pen);white-space:nowrap}
.brand::before{content:'';display:inline-block;width:9px;height:9px;border:2px solid var(--pen);border-radius:50%;margin-right:7px;vertical-align:0}
.match-title{flex:1;min-width:240px;padding-left:18px;border-left:1px solid var(--rule)}
.match-title b{display:block;font-size:19px;font-weight:700}
.match-title .meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px}
.state{font-weight:600;font-size:14px;color:var(--ink2);padding:4px 10px;border:1px solid var(--rule2);border-radius:var(--r);white-space:nowrap}
.state.live{color:#fff;background:var(--pen);border-color:var(--pen)}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}

/* ---- Buttons ---- */
.btn{display:inline-block;padding:8px 14px;border:1px solid var(--rule2);border-radius:var(--r);background:var(--surface);font-weight:600;font-size:15px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.primary:hover:not(:disabled){background:#18337a}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover:not(:disabled){background:var(--paper);border-color:transparent}
.btn.danger{color:var(--danger)}.btn:disabled{opacity:.4}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.linkBtn{border:0;background:none;color:var(--pen);text-decoration:underline;font-weight:600;padding:0 4px}

/* ---- Main ---- */
.app{max-width:1200px;margin:auto;padding:18px 20px 48px}
.setstrip{display:flex;width:fit-content;max-width:100%;margin:0 auto 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow-x:auto}
.setstrip div{padding:6px 18px;border-right:1px solid var(--rule);text-align:center;min-width:84px}
.setstrip div:last-child{border-right:0}
.setstrip small{display:block;color:var(--muted);font-size:13px}
.setstrip b{font-size:18px;font-variant-numeric:tabular-nums;font-weight:600}
.setstrip .cur{background:var(--pen-soft)}.setstrip .cur small,.setstrip .cur b{color:var(--pen)}
.setstrip .todo b{color:var(--rule2)}
.status{text-align:center;color:var(--ink2);margin:0 0 16px;font-size:16px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.team{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 18px 14px 22px;min-width:0}
.team::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:6px;background:var(--team);border-radius:6px 0 0 6px}
.team-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.team-h h2{margin:0;font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serving{font-size:15px;font-weight:600;color:var(--pen);white-space:nowrap}
.serving::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pen);margin-right:6px;vertical-align:1px}
.team-body{display:flex;align-items:center;gap:20px;margin:6px 0 12px}
.score{font-size:88px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;min-width:1.25em;letter-spacing:-.01em}
.facts{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--rule)}
.facts div{padding:5px 0;border-bottom:1px solid var(--rule)}
.facts span{display:block;color:var(--muted);font-size:13px}
.facts b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.point{width:100%;padding:15px;border:0;border-radius:var(--r);background:var(--team);color:#fff;font-size:21px;font-weight:700}
.point:hover:not(:disabled){filter:brightness(.92)}
.point:disabled{background:#e8ecf1;color:#99a4b2}
.point.verify{background:var(--surface);color:var(--team);box-shadow:inset 0 0 0 2px var(--team)}
.court{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 2px;border:1px solid var(--rule2);border-radius:var(--r);overflow:hidden}
.net{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);background:repeating-linear-gradient(90deg,var(--rule) 0 2px,transparent 2px 8px);border-bottom:2px solid var(--ink2);padding:1px 0;line-height:1.3}
.net span{background:var(--surface);padding:0 8px}
.pos{position:relative;padding:20px 6px 8px;text-align:center;background:var(--surface);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:76px}
.pos:nth-child(3n+1){border-right:0}
.pos:nth-child(n+5){border-bottom:0}
.pos .p{position:absolute;left:8px;top:5px;font-size:13px;color:var(--muted)}
.pos.server .p{color:var(--pen);font-weight:600}
.pos b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pos .for{display:block;font-size:14px;color:var(--ink2);margin-top:3px}
.pos.lib{background:#fdf6ea}
.pos.target{background:var(--pen-soft);box-shadow:inset 0 0 0 2px var(--pen);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--ink2);color:#fff;vertical-align:6px;margin-left:3px;line-height:1.2}
.tag.l{background:#a86a12}
.bench{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;min-height:34px}
.bench .lbl{color:var(--muted);font-size:14px;margin-right:4px}
.libBtn{padding:6px 10px;border:1px solid var(--rule2);border-radius:var(--r);background:var(--surface);font-weight:600;font-size:15px}
.libBtn.selected{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.libBtn.return{border-style:dashed;border-color:var(--pen);color:var(--pen)}
.hint{font-size:14px;color:var(--pen);width:100%}
.warning{background:var(--warn-bg);border:1px solid var(--warn-line);color:#5a3d00;padding:8px 11px;border-radius:var(--r);margin:8px 0;font-size:15px}
.notice{background:var(--ok-bg);border:1px solid var(--ok-line);padding:8px 11px;border-radius:var(--r);margin:8px 0;font-size:15px}

/* ---- Dialogs ---- */
.overlay{position:fixed;inset:0;background:rgba(23,32,44,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:20}

.close{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:2px 6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.span2{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2);min-width:0}

.pickall{margin-top:8px}.pickall summary{cursor:pointer;color:var(--pen);font-weight:600;font-size:15px}

/* substitution table */

.subtable .ch{width:120px;color:var(--muted);font-variant-numeric:tabular-nums}.subtable .ch s{color:var(--muted)}.subtable .ch b{color:var(--ink)}
.inbtn{padding:5px 10px;margin:2px 4px 2px 0;border:1px solid var(--rule2);border-radius:var(--r);background:var(--surface);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:6px;font-weight:600;max-width:min(560px,92vw);box-shadow:0 8px 28px rgba(23,32,44,.3);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}.toast.error{background:#8b1c1c}

#printArea{display:none}
@media(max-width:760px){
 .appbar-in{padding:8px 12px}.match-title{border-left:0;padding-left:0;order:3;flex-basis:100%}
 .app{padding:12px 10px 40px}.teams{gap:8px}.team{padding:10px 10px 10px 14px}.team-h h2{font-size:18px}.serving{font-size:13px}
 .team-body{flex-direction:column;align-items:stretch;gap:6px}.score{font-size:56px;text-align:center}.facts span{font-size:12px}.facts b{font-size:15px}
 .point{padding:13px 4px;font-size:17px}.pos{min-height:58px;padding:17px 2px 6px}.pos b{font-size:19px}.pos .for{font-size:12px}.libBtn{font-size:13px;padding:5px 7px}
 .grid2,.pick3{grid-template-columns:1fr}.span2{grid-column:auto}.modal{padding:16px}.slots{grid-template-columns:repeat(4,1fr)}
 .event{grid-template-columns:52px 1fr auto;font-size:14px}.event .tm{display:none}
 .subtable th:nth-child(3),.subtable td:nth-child(3){display:none}.subtable .oc{width:70px}
}
@media print{
 html,body{margin:0!important;padding:0!important;background:#fff!important}
 body>*:not(#printArea){display:none!important}#printArea{display:block!important}

 .printPage.portrait{width:8.5in;height:11in}.printPage.portrait .ncaaSvg{width:8.5in;height:11in}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<body>
<header class="appbar"><div class="appbar-in">
 <div class="brand">Volleyball Scoresheet</div>
 <div class="match-title" id="matchSummary"></div>
 <span class="state" id="matchState">Setup</span>
 <div class="btnrow"><button class="btn quiet" onclick="meta&&openPregame(false)">Match info</button><button class="btn quiet" onclick="openBackup()">Backup</button><button class="btn" onclick="newMatch()">New match</button></div>
</div></header>
<main class="app">
 <div class="setstrip" id="sets"></div>
 <p class="status" id="status" aria-live="polite"></p>
 <div class="teams" id="teams"></div>
 <div class="controls"><div class="toolbar" id="toolbar"></div><div class="toolbar" id="toolbar2"></div></div>
 <section class="logwrap"><div class="log-h"><h3>Match log</h3><span class="help">Newest first. Edit corrects an entry and re-checks the whole match.</span></div><div class="log" id="log"></div></section>
</main>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<style id="pageStyle">@media print{@page{size:letter landscape;margin:0}}</style>
<script>
'use strict';
/* =====================================================================
   Digital Volleyball Scoresheet — v22
   ---------------------------------------------------------------------
   Design: the match is stored as an ordered ACTION LOG (lineup, serve,
   rally, sub, libero, timeout, sanction, captain, note, confirmSet).
   The live state is always rebuilt by replaying that log through one
   rules engine (apply). That makes Undo exact, lets past entries be
   corrected safely (the whole match is re-checked), and gives the
   scoresheet a complete, consistent history to draw from.
   Sections:
     1. Constants & utilities      5. UI: main screen
     2. Rules engine               6. UI: dialogs & flows
     3. Storage & migration        7. Scoresheet renderer
     4. Commands (act/undo/edit)   8. Printing & startup
   ===================================================================== */

// ---------- 1. Constants & utilities ----------
const TEAMS=['A','B'];
const POS=['I','II','III','IV','V','VI'];      // rot[0]=I (server) … rot[5]=VI
const BACK_ROW=[0,4,5];                         // I, V, VI
const COURT_ORDER=[3,2,1,4,5,0];                // display: IV III II / V VI I
const TEAM_COLORS=['#0c6644','#1d4ed8','#dc2626','#7c3aed','#ea580c','#0891b2','#111827','#6b7280','#ca8a04','#db2777'];
const STORE_KEY='vbscoresheet.v22',OLD_KEY='vbscore16';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o));
const other=t=>t==='A'?'B':'A';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtClock=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
const fmtDur=ms=>{if(!ms||ms<0)return '—';const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const jerseyList=()=>['00',...Array.from({length:100},(_,i)=>String(i))];
const sortJerseys=a=>[...a].sort((x,y)=>(+x-+y)||x.length-y.length);

let meta=null;      // match information (teams, rosters, officials, rules)
let log=[];         // the action log — the single source of truth
let st=null;        // state derived by replaying the log
const ui={swapped:false,selLibero:null,sheetSet:1,draft:null,sub:null,pg:null,shownSwitchAt:null};

function defaultMeta(){return {date:todayISO(),time:'19:00',tourney:'',facility:'',city:'',division:"NAIA Women's",visitor:'',home:'',
 colors:{A:'#0c6644',B:'#1d4ed8'},rosters:{A:[],B:[]},r1:'',r2:'',lj1:'',lj2:'',scorekeeper:'',
 setsToWin:3,timeoutsPerSet:2,subsAllowed:18,unlimitedSubs:false,crs:false}}
function isNAIA(m=meta){return /^NAIA/i.test(m?.division||'')}
function subsUnlimited(m=meta){return !!m?.unlimitedSubs||isNAIA(m)}
function teamName(t,m=meta){return t==='MEDIA'?'Media':((t==='A'?m?.visitor:m?.home)||`Team ${t}`)}
function isDecidingSet(n,m=meta){return n===m.setsToWin*2-1}
function setTarget(n,m=meta){return isDecidingSet(n,m)?15:25}
function maxSets(m=meta){return m.setsToWin*2-1}

// ---------- 2. Rules engine ----------
class RuleError extends Error{}
const fail=msg=>{throw new RuleError(msg)};

function newMatchState(){return {challenges:{A:2,B:2},set:1,phase:'lineup',setsWon:{A:0,B:0},setRecords:{},lineups:{},cur:null,pending:null,history:[],matchStart:null,matchEnd:null}}
function newSetState(L){
 const c={scores:{A:0,B:0},serving:L.firstServe,hasServed:{A:false,B:false},rot:{},slotIds:{},slotHistory:{},liberos:{},lib:{},counts:{},captain:{},verified:null,rally:0,start:null};
 c.hasServed[L.firstServe]=true;
 for(const t of TEAMS){
  c.rot[t]=[...L[t].rot];c.slotIds[t]=[0,1,2,3,4,5];c.slotHistory[t]={};
  L[t].rot.forEach((n,i)=>c.slotHistory[t][i]=[n]);
  c.liberos[t]={L1:L[t].liberos.L1||'',L2:L[t].liberos.L2||''};
  c.lib[t]={on:null,replaced:null,slot:null,lastExit:-99,serveSlot:null};
  c.counts[t]={to:0,subs:0};c.barred=c.barred||{A:[],B:[]};
  c.seq=c.seq||{};c.seq[t]=L[t].rot.map(n=>[n]);
  c.captain[t]={game:L[t].captain,floor:L[t].captain};
 }
 return c;
}
const scoreOf=c=>c?[c.scores.A,c.scores.B]:[0,0];
const liberoNums=(c,t)=>Object.values(c.liberos[t]).filter(Boolean);
function rotate(c,t){c.rot[t].push(c.rot[t].shift());c.slotIds[t].push(c.slotIds[t].shift())}
function expectedServer(c){const t=c.serving,L=c.lib[t],isLib=!!L.on&&c.slotIds[t][0]===L.slot;return {team:t,number:c.rot[t][0],libero:isLib?L.on:null,slot:c.slotIds[t][0],forPlayer:isLib?L.replaced:null}}
function liberoIndex(c,t){const L=c.lib[t];return L.on?c.slotIds[t].indexOf(L.slot):-1}
function frontRowLibero(c,t){const i=liberoIndex(c,t);return i>=0&&!BACK_ROW.includes(i)}
function fixCaptain(c,t){
 const C=c.captain[t],on=c.rot[t],libs=liberoNums(c,t);
 if(on.includes(C.game))C.floor=C.game;
 else if(!(C.floor&&on.includes(C.floor)&&!libs.includes(C.floor)))C.floor=null;
}
// Returns an error message, or null when the substitution is legal.
function subError(c,t,inP,outP,m){
 const tn=teamName(t,m),L=c.lib[t],libs=liberoNums(c,t);
 if(!subsUnlimited(m)&&c.counts[t].subs>=m.subsAllowed)return `${tn} has used all ${m.subsAllowed} substitutions this set.`;
 if(!(m.rosters[t]||[]).includes(inP))return `#${inP} is not on the ${tn} roster.`;
 if(libs.includes(inP)||libs.includes(outP))return 'Liberos are exchanged, not substituted. Use the libero buttons under the court.';
 if(L.on&&inP===L.replaced)return `#${inP} is off the court for the libero. Bring #${inP} back with a libero exchange first.`;
 if(c.rot[t].includes(inP))return `#${inP} is already on the court.`;
 const idx=c.rot[t].indexOf(outP);if(idx<0)return `#${outP} is not on the court.`;
 const slot=c.slotIds[t][idx];
 if(c.barred?.[t]?.includes(inP))return `#${inP} left the set by an exceptional substitution and may not return this set.`;
 for(const [k,arr] of Object.entries(c.slotHistory[t]))if(+k!==slot&&arr.includes(inP))return `#${inP} already played in service position ${POS[k]} this set and may only return to that position.`;
 return null;
}
// Exceptional substitution (injury/illness): any eligible bench player, does not count against the limit,
// and the player replaced may not return this set.
function excSubError(c,t,inP,outP,m){
 const tn=teamName(t,m),L=c.lib[t],libs=liberoNums(c,t);
 if(!(m.rosters[t]||[]).includes(inP))return `#${inP} is not on the ${tn} roster.`;
 if(libs.includes(inP)||libs.includes(outP))return 'Liberos are exchanged, not substituted.';
 if(L.on&&inP===L.replaced)return `#${inP} is off the court for the libero.`;
 if(c.rot[t].includes(inP))return `#${inP} is already on the court.`;
 if(c.barred?.[t]?.includes(inP))return `#${inP} left the set by an exceptional substitution and may not return this set.`;
 if(c.rot[t].indexOf(outP)<0)return `#${outP} is not on the court.`;
 return null;
}
function liberoError(c,t,kind,replaces){
 const L=c.lib[t],num=c.liberos[t][kind];
 if(!num)return `No ${kind} is listed for ${teamName(t)}.`;
 if(L.on===kind)return null;                                    // exit
 if(L.on){const i=liberoIndex(c,t);return BACK_ROW.includes(i)?null:'A libero in the front row must be replaced by the regular player, not the other libero.'}
 const idx=c.rot[t].indexOf(replaces);
 if(idx<0)return `#${replaces} is not on the court.`;
 if(!BACK_ROW.includes(idx))return 'The libero may only replace a back-row player (positions I, V or VI).';
 const servingIn=t===c.serving&&idx===0;
 if(c.rally-L.lastExit<1&&!servingIn)return 'A completed rally must be played before the libero can return.';
 return null;
}
// The one place every action is checked and applied. Mutates st.
function apply(st,a,i,m){
 const H=x=>st.history.push({i,a,set:st.set,...x});
 const c=st.cur;
 if(a.type==='note'){H({score:scoreOf(c)});return}
 if(a.type==='lineup'){
  if(st.phase!=='lineup')fail('Lineups can only be entered before a set starts.');
  if(a.set!==st.set)fail(`These lineups are for set ${a.set}, but set ${st.set} is next.`);
  if(!TEAMS.includes(a.firstServe))fail('Choose which team serves first.');
  const L={firstServe:a.firstServe};
  for(const t of TEAMS){
   const d=a[t],tn=teamName(t,m),roster=m.rosters[t]||[];
   if(!d||d.rot.length!==6||d.rot.some(x=>!x))fail(`Enter all six starters for ${tn}.`);
   if(new Set(d.rot).size!==6)fail(`${tn} has a duplicate starter.`);
   for(const n of d.rot)if(!roster.includes(n))fail(`#${n} is not on the ${tn} roster.`);
   const l1=d.liberos?.L1||'',l2=d.liberos?.L2||'';
   for(const l of [l1,l2])if(l&&(!roster.includes(l)||d.rot.includes(l)))fail(`${tn}: a libero must be on the roster and not in the starting six.`);
   if(l1&&l1===l2)fail(`${tn}: L1 and L2 must be different players.`);
   if(!l1&&l2)fail(`${tn}: enter L1 before L2.`);
   if(!d.rot.includes(d.captain))fail(`Choose the ${tn} captain from the starting six.`);
   L[t]={rot:[...d.rot],liberos:{L1:l1,L2:l2},captain:d.captain};
  }
  st.lineups[st.set]=L;st.cur=newSetState(L);st.phase='live';
  if(isDecidingSet(st.set,m))for(const t of TEAMS)st.challenges[t]=Math.min(2,st.challenges[t]+1);
  H({score:[0,0]});return;
 }
 if(a.type==='confirmSet'){
  if(st.phase!=='setEnd')fail('There is no finished set waiting to be confirmed.');
  const p=st.pending;st.setRecords[p.set]={...p,signedAt:a.t||null};st.setsWon[p.w]++;
  H({score:[p.a,p.b],winner:p.w});st.pending=null;
  if(st.setsWon[p.w]>=m.setsToWin){st.phase='final';st.matchEnd=p.end;return}
  st.set++;st.phase='lineup';st.cur=null;return;
 }
 if(a.type==='challenge'){
  if(!m.crs)fail('Challenge review (CRS) is not turned on for this match. Turn it on in Match Info.');
  if(!(st.phase==='live'||st.phase==='setEnd'))fail('A challenge can only be recorded during a set.');
  if(st.phase==='live'&&c.verified)fail('Challenges are recorded after the rally, before the next serve.');
  if(!TEAMS.includes(a.team))fail('Choose a team.');
  if(!['stands','reversed','failure'].includes(a.outcome))fail('Choose the outcome.');
  if(st.challenges[a.team]<=0&&a.outcome!=='failure')fail(`${teamName(a.team,m)} has no challenges left.`);
  const num=st.history.filter(x=>x.a.type==='challenge'&&x.a.team===a.team&&x.a.outcome!=='failure').length+1;

function awardPoint(st,c,w,m,t){

function replayLog(m,lg){

// ---------- 3. Storage & migration ----------
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({app:'vb-scoresheet',v:22,meta,log,ui:{swapped:ui.swapped}}))}catch(e){toast('Could not save on this device (storage full or blocked). Use Backup → Export to keep a copy.','error')}}
function loadSaved(){
 let raw=null;try{raw=localStorage.getItem(STORE_KEY)}catch(e){}
 if(raw){try{const d=JSON.parse(raw);meta={...defaultMeta(),...d.meta};log=d.log||[];ui.swapped=!!d.ui?.swapped;st=replayLog(meta,log);return}
  catch(e){console.error(e);try{localStorage.setItem(STORE_KEY+'.broken',raw)}catch(_){}meta=null;log=[];toast('The saved match could not be loaded; a copy was kept on this device.','error')}}
 let old=null;try{old=localStorage.getItem(OLD_KEY)}catch(e){}
 if(old){
  try{const o=JSON.parse(old);if(o.setupComplete){const conv=migrateV20(o);st=replayLog(conv.meta,conv.log);meta=conv.meta;log=conv.log;save();toast('Your saved match was upgraded to the new version.')}}
  catch(e){console.error(e);toast('A match saved by an older version could not be upgraded. A backup copy was kept.','error');meta=null;log=[]}
  try{localStorage.setItem(OLD_KEY+'.backup',old);localStorage.removeItem(OLD_KEY)}catch(e){}
 }
}
// Converts the v15–v21 snapshot format into the action log.
function migrateV20(o){
 const om=o.meta||{},m={...defaultMeta(),...om,setsToWin:om.matchType||om.setsToWin||3,rosters:{A:[...(om.rosters?.A||[])],B:[...(om.rosters?.B||[])]},colors:om.colors||defaultMeta().colors};
 delete m.matchType;
 const names=[['A',m.visitor],['B',m.home]].sort((x,y)=>(y[1]||'').length-(x[1]||'').length);
 const teamOf=txt=>{for(const [t,n] of names)if(n&&txt.startsWith(n))return t;return null};
 const recs=o.setRecords||{},lg=[];let set=1,prev=[0,0],firstServe=true;
 const parse=x=>{const mm=String(x||'').match(/(\d+)\s*-\s*(\d+)/);return mm?[+mm[1],+mm[2]]:[0,0]};
 for(const e of o.events||[]){
  const txt=e.text||'';
  switch(e.type){
   case 'LINEUP':{set=e.set||set;const L=o.lineups?.[set];if(!L)break;
    let fs=L.firstServe;if(!fs){const mm=/•\s*(.+) serves first/.exec(txt);fs=mm&&mm[1]===m.home?'B':'A'}
    lg.push({type:'lineup',set,A:{rot:L.A.rot,liberos:L.A.liberos||{},captain:L.A.captain},B:{rot:L.B.rot,liberos:L.B.liberos||{},captain:L.B.captain},firstServe:fs,t:null});prev=[0,0];firstServe=true;break}
   case 'SERVER':lg.push({type:'serve',t:firstServe?(recs[set]?.start||null):null});firstServe=false;break;
   case 'POINT':{const sc=parse(e.score),w=e.pointTeam||(sc[0]>prev[0]?'A':'B');prev=sc;const r=recs[set];lg.push({type:'rally',winner:w,t:r&&sc[0]===+r.a&&sc[1]===+r.b?r.end:null});break}
   case 'REPLAY':lg.push({type:'replay'});break;
   case 'SUBSTITUTION':{let t=e.team,inP=e.inPlayer,outP=e.outPlayer;if(!t){const mm=/•\s*(.+?)\s*•\s*#(\S+) IN \/ #(\S+) OUT/.exec(txt);if(mm){t=mm[1]===m.home?'B':'A';inP=mm[2];outP=mm[3]}}if(t)lg.push({type:'sub',team:t,in:inP,out:outP});break}
   case 'LIBERO':{const t=teamOf(txt);if(!t)break;const rest=txt.slice((t==='A'?m.visitor:m.home).length).trim();let mm;
    if((mm=/^(L[12]) #\S+ replaces (L[12]) directly/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1]});
    else if((mm=/^(L[12]) #\S+ replaces #(\S+)/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1],replaces:mm[2]});
    else if((mm=/^#\S+ returns for (L[12])/.exec(rest)))lg.push({type:'libero',team:t,kind:mm[1]});
    break}
   case 'TIMEOUT':{let t=e.team;if(!t)t=/Media/.test(txt)?'MEDIA':(txt.includes(m.home)?'B':'A');lg.push({type:'timeout',team:t});break}
   case 'NOTE':lg.push({type:'note',text:txt});break;
   case 'SET':lg.push({type:'confirmSet',t:recs[set]?.signedAt||null});set++;break;
  }

}

// ---------- 4. Commands ----------
// Every user action goes through act(): it is checked by the rules engine before it is kept.
function act(a){

 try{apply(next,entry,log.length,meta)}
 catch(e){if(e instanceof RuleError){toast(e.message,'error');return false}throw e}

}
// Replace the log (used by undo / corrections). The whole match is re-checked first.
function replaceLog(newLog,okMsg){

 catch(e){if(e instanceof RuleError){const h=st.history.find(x=>x.i===e.index);toast(`That change conflicts with a later entry${h?` (set ${h.set}, ${h.score.join('-')})`:''}: ${e.message}`,'error');return false}throw e}
}
function undo(){
 if(!log.length)return;

 const doIt=()=>{closeModal(true);ui.selLibero=null;replaceLog(log.slice(0,-1),'Undone: '+describe(st.history[st.history.length-1]))};
 if(last.type==='confirmSet'||last.type==='lineup')confirmDialog(last.type==='confirmSet'?`Undo the signed confirmation of set ${st.history[st.history.length-1].set}?`:`Undo the set ${last.set} lineups?`,'Undo',doIt);

function editLog(i,fn,msg){const nl=clone(log);fn(nl);if(replaceLog(nl,msg))closeModal(true)}

function describe(h){

  case 'lineup':return `Set ${a.set} lineups verified, ${tn(a.firstServe)} serves first`;
  case 'serve':return `${tn(h.team)} serve: ${h.libero?h.libero+' ':''}#${h.server}${h.forPlayer?` (for #${h.forPlayer})`:''}`;
  case 'rally':return `Point ${tn(a.winner)}${h.sideOut?' (side out)':''}`;
  case 'replay':return `Replay, #${h.server} serves again`;
  case 'sub':return a.exceptional?`${tn(a.team)}: #${a.in} in for injured #${a.out} — exceptional substitution`:`${tn(a.team)}: #${a.in} in for #${a.out} (sub ${h.count})`;
  case 'libero':return h.what==='in'?`${tn(a.team)}: ${a.kind} #${h.num} in for #${h.player}`:h.what==='out'?`${tn(a.team)}: #${h.player} back in for ${a.kind}`:`${tn(a.team)}: ${a.kind} #${h.num} replaces the other libero`;
  case 'challenge':return `Challenge #${h.num} ${tn(a.team)} — ${{stands:'confirmed/stands',reversed:'reversed',failure:'video failure (not counted)'}[a.outcome]} (${h.left} left)`;
  case 'timeout':return a.team==='TECH'?'Technical timeout':a.team==='MEDIA'?'Media timeout':`Timeout ${tn(a.team)} (${h.count} of ${meta.timeoutsPerSet})`;
  case 'captain':return `${tn(a.team)}: floor captain #${a.player}`;
  case 'sanction':return `${{IR:'Improper request',YC:'Yellow card',RC:'Red card'}[a.kind]} — ${tn(a.team)}${a.who?' '+(/^\d/.test(a.who)?'#'+a.who:a.who):''}${a.kind==='RC'?` • point ${tn(other(a.team))}`:''}`;
  case 'note':return `Note: ${a.text}`;

   return dialog(`<h2>Change sides</h2><p>Teams change sides of the court after the second set (NCAA rule 9.2.4). They stay on those sides for the rest of the match; before a fifth set the coin-toss winner may choose to serve, receive or pick a side.</p>`,[['Not now','closeModal()'],['Switch sides on screen','swapSides();closeModal()','primary']])}

 $('lu-'+t).innerHTML=`<h3 style="margin-top:0;border-left:6px solid ${meta.colors[t]};padding-left:8px">${esc(teamName(t))}</h3>
 <div class="slots">${[0,1,2,3,4,5,6,7].map(i=>`<button class="slot ${d.active===i?'active':''}" onclick="ui.draft.${t}.active=${i};drawLineup('${t}')"><small>${i<6?POS[i]:i===6?'L1':'L2'}</small>${luVal(d,i)?'#'+esc(luVal(d,i)):'—'}</button>`).join('')}</div>
 <div class="muted small">Filling <b>${d.active<6?'position '+POS[d.active]:d.active===6?'libero L1':'libero L2'}</b> ${luVal(d,d.active)?`<button class="linkBtn" onclick="luSet(ui.draft.${t},ui.draft.${t}.active,'');drawLineup('${t}')">clear</button>`:''}</div>
 <div class="jerseys">${(meta.rosters[t]||[]).map(n=>`<button class="jersey ${used.has(n)?'used':''}" onclick="luPick('${t}','${n}')">#${n}</button>`).join('')}</div>
 <b>Captain</b><div class="jerseys">${d.rot.filter(Boolean).map(n=>`<button class="jersey ${d.captain===n?'prior':''}" onclick="ui.draft.${t}.captain='${n}';drawLineup('${t}')">#${n}</button>`).join('')||'<span class="muted small">Enter starters first</span>'}</div>`;

// --- Substitutions ---
// --- Substitutions: one row per service position, so each incoming player is shown against the player they replace ---
function openSub(team,exc){
 if(!canPreServe())return;
 ui.subTeam=team||ui.subTeam||st.cur.serving;ui.subExc=!!exc;ui.subMsg='';drawSub();
}
function drawSub(){
 const t=ui.subTeam,exc=ui.subExc,c=st.cur,chk=exc?excSubError:subError,L=c.lib[t];
 const capped=!exc&&!subsUnlimited()&&c.counts[t].subs>=meta.subsAllowed;
 const used=x=>subsUnlimited()?`${c.counts[x].subs} used`:`${c.counts[x].subs} of ${meta.subsAllowed}`;
 const rows=[0,1,2,3,4,5].map(i=>{
  const slot=c.slotIds[t][i],n=c.rot[t][i],isLib=L.on&&slot===L.slot,seq=c.seq?.[t]?.[slot]||[n];
  const chain=seq.map((x,k)=>k<seq.length-1?`<s>${esc(x)}</s>`:`<b>${esc(x)}</b>`).join(' ');
  let ins;
  if(isLib)ins=`<span class="muted">${L.on} #${esc(n)} is in for #${esc(L.replaced)}. Bring #${esc(L.replaced)} back with the libero button first.</span>`;
  else if(capped)ins='<span class="muted">No substitutions left this set.</span>';
  else{
   const elig=(meta.rosters[t]||[]).filter(p=>!chk(c,t,p,n,meta)),ret=elig.filter(p=>seq.includes(p)),fresh=elig.filter(p=>!seq.includes(p));
   ins=[...ret.map(p=>`<button class="inbtn ret" onclick="subDo('${t}','${p}','${n}')">${esc(p)}<small>returns</small></button>`),...fresh.map(p=>`<button class="inbtn" onclick="subDo('${t}','${p}','${n}')">${esc(p)}</button>`)].join('')||'<span class="muted">No eligible bench players.</span>';
  }
  return `<tr><td class="pl">${POS[i]}</td><td class="oc"><b>#${esc(n)}</b>${isLib?' <span class="tag l">L</span>':''}${!isLib&&seq.length>1?`<span class="for">for #${esc(seq[seq.length-2])}</span>`:''}</td><td class="ch">${chain}</td><td>${ins}</td></tr>`;
 }).join('');
 showModal(`<h2>Substitution</h2>
 <div class="tabs">${TEAMS.map(x=>`<button class="tab ${x===t?'on':''}" onclick="ui.subTeam='${x}';ui.subMsg='';drawSub()">${esc(teamName(x))}<span class="muted">${used(x)}</span></button>`).join('')}</div>
 ${ui.subMsg?`<div class="notice">${ui.subMsg} <button class="linkBtn" onclick="undoSub()">Undo</button></div>`:''}
 <label class="check"><input type="checkbox" ${exc?'checked':''} onchange="ui.subExc=this.checked;ui.subMsg='';drawSub()"> Exceptional substitution (injury or illness). It doesn't count toward the limit, and the player removed can't return this set.</label>
 <table class="subtable"><thead><tr><th>Position</th><th>On court</th><th>This set</th><th>Tap the player coming in</th></tr></thead><tbody>${rows}</tbody></table>
 <p class="help">Earlier players in each position are struck through. A player marked <i>returns</i> already played that position; anyone who played a different position can only go back to that one.</p>
 <div class="actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`,{wide:true});
}
function subDo(t,inP,outP){
 const exc=ui.subExc,idx=st.cur.rot[t].indexOf(outP);
 if(!act({type:'sub',team:t,in:inP,out:outP,...(exc?{exceptional:true}:{})}))return;
 ui.subExc=false;
 ui.subMsg=`Recorded: #${esc(inP)} in for #${esc(outP)} at position ${POS[idx]}${exc?' (exceptional)':''}.`;

function undoSub(){const t=ui.subTeam;if(log[log.length-1]?.type!=='sub')return;replaceLog(log.slice(0,-1),'Substitution undone.');ui.subTeam=t;ui.subMsg='';drawSub()}


// --- Challenges (CRS) ---
function canChallenge(){return !!meta?.crs&&((st.phase==='live'&&!st.cur.verified)||st.phase==='setEnd')}
function openChallenge(team){
 if(!canChallenge())return;
 if(!team)return showModal(`<h2>Challenge</h2><p class="muted">Which coach challenged? Score is ${scoreOf(st.cur).join('-')}.</p><div class="pick2">${TEAMS.map(t=>`<button ${st.challenges[t]>0?'':'disabled'} onclick="openChallenge('${t}')">${esc(teamName(t))}<br><span class="muted small">${st.challenges[t]} left</span></button>`).join('')}</div>`);
 showModal(`<h2>Challenge — ${esc(teamName(team))}</h2><p class="muted">Outcome of the video review</p><div class="pick3">
  <button onclick="challengeDo('${team}','stands')"><b>Confirmed / Stands</b><br><span class="muted small">challenge is used</span></button>
  <button onclick="challengeDo('${team}','reversed')"><b>Reversed</b><br><span class="muted small">challenge is kept</span></button>
  <button onclick="challengeDo('${team}','failure')"><b>Video failure</b><br><span class="muted small">doesn't count</span></button></div><div class="actions"><button class="btn left" onclick="openChallenge()">Back</button></div>`);
}
function challengeDo(t,outcome){
 const lastRally=[...log.keys()].reverse().find(i=>log[i].type==='rally');
 if(!act({type:'challenge',team:t,outcome}))return;
 if(outcome==='reversed'&&lastRally!==undefined){
  const w=log[lastRally].winner;
  return dialog(`<h2>Challenge reversed</h2><p>Correct the last rally? It's currently scored for <b>${esc(teamName(w))}</b>.</p>`,[['Leave it','closeModal()'],[`Give the point to ${esc(teamName(other(w)))}`,`editLog(${lastRally},l=>{l[${lastRally}].winner='${other(w)}';l[${lastRally}].edited=true},'Point corrected after the challenge.')`,'primary']]);

}

  <button onclick="sanctionDo('${step.team}','IR','')"><b>Improper request</b><br><span class="muted small">no penalty</span></button>
  <button onclick="openSanction({team:'${step.team}',kind:'YC'})"><b>Yellow card</b><br><span class="muted small">warning</span></button>
  <button onclick="openSanction({team:'${step.team}',kind:'RC'})"><b>Red card</b><br><span class="muted small">point + serve to ${esc(teamName(other(step.team)))}</span></button></div><div class="actions"><button class="btn left" onclick="openSanction()">Back</button></div>`);
 const L=st.lineups[st.set][step.team],libs=[L.liberos.L1,L.liberos.L2].filter(Boolean);
 showModal(`<h2>${step.kind==='YC'?'Yellow':'Red'} card — ${esc(teamName(step.team))}</h2><p class="muted">Who was sanctioned?</p><div class="jerseys"><button class="jersey" onclick="sanctionDo('${step.team}','${step.kind}','Coach')">Coach</button><button class="jersey" onclick="sanctionDo('${step.team}','${step.kind}','Team')">Team</button>${(meta.rosters[step.team]||[]).map(n=>`<button class="jersey" onclick="sanctionDo('${step.team}','${step.kind}','${n}')">#${n}${libs.includes(n)?'<small>libero</small>':''}</button>`).join('')}</div><div class="actions"><button class="btn left" onclick="openSanction({team:'${step.team}'})">Back</button></div>`);
}
function sanctionDo(t,kind,who){if(act({type:'sanction',team:t,kind,who})){closeModal()}}

// --- Notes ---
function openNote(){showModal(`<h2>Note</h2><p class="muted">Notes are printed in the Comments box of the scoresheet.</p><textarea class="field" id="noteText" rows="3" maxlength="200"></textarea><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="const x=$('noteText').value.trim();if(x&&act({type:'note',text:x}))closeModal()">Add note</button></div>`);setTimeout(()=>$('noteText')?.focus(),30)}

// --- Set confirmation ---
function openSetConfirm(){
 const p=st.pending,dur=p.start&&p.end?p.end-p.start:0,clinch=st.setsWon[p.w]+1>=meta.setsToWin;
 showModal(`<h2>Confirm set ${p.set}</h2><div class="bigscore">${p.a} - ${p.b}</div><p style="text-align:center"><b>${esc(teamName(p.w))}</b> wins set ${p.set}${clinch?' and the match':''}.</p>
 <div class="stats"><div><b>Set started</b><br>${fmtClock(p.start)}</div><div><b>Set ended</b><br>${fmtClock(p.end)}</div></div>
 <div class="warning">Set time ${fmtDur(dur)}${clinch&&st.matchStart?` • Match time ${fmtDur(p.end-st.matchStart)}`:''}. Confirming signs the set for ${esc(meta.scorekeeper||'the scorer')}.</div>
 <div class="actions"><button class="btn left" onclick="closeModal(true);undo()">Undo last point</button>${meta.crs?'<button class="btn" onclick="closeModal(true);openChallenge()">Challenge</button>':''}<button class="btn primary" onclick="if(act({type:'confirmSet'}))closeModal()">Confirm score & sign set</button></div>`,{dismiss:false});
}

// --- Corrections ---
function openEdit(i){
 const a=log[i],h=st.history.find(x=>x.i===i);if(!a||!h)return;
 const head=`<h2>Correct entry</h2><p class="muted">Set ${h.set} • ${h.score.join('-')} • ${esc(describe(h))}</p><p class="small muted">The whole match is re-checked after a correction. If a later entry would no longer be legal, the change is refused.</p>`;
 const del=`<button class="btn danger left" onclick="editLog(${i},l=>l.splice(${i},1),'Entry removed.')">Delete entry</button>`;
 if(a.type==='rally')return dialog(head,[['Cancel','closeModal()'],[`Point goes to ${esc(teamName(other(a.winner)))} instead`,`editLog(${i},l=>{l[${i}].winner='${other(a.winner)}';l[${i}].edited=true},'Rally corrected.')`,'primary']]);
 if(a.type==='timeout')return showModal(head+`<div class="pick2">${[...TEAMS,'MEDIA'].filter(t=>t!==a.team).map(t=>`<button onclick="editLog(${i},l=>{l[${i}].team='${t}';l[${i}].edited=true},'Timeout corrected.')">Change to ${esc(t==='MEDIA'?'media timeout':teamName(t))}</button>`).join('')}</div><div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button></div>`);
 if(a.type==='sub'){const r=meta.rosters[a.team];const o=(id,v)=>`<select class="field" id="${id}">${r.map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}</select>`;
  return showModal(head+`<div class="grid2"><label>Player IN${o('ed-in',a.in)}</label><label>Player OUT${o('ed-out',a.out)}</label></div><div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="editLog(${i},l=>{l[${i}].in=$('ed-in').value;l[${i}].out=$('ed-out').value;l[${i}].edited=true},'Substitution corrected.')">Save</button></div>`)}
 if(a.type==='note')return showModal(head+`<textarea class="field" id="ed-note" rows="3">${esc(a.text)}</textarea><div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="editLog(${i},l=>{l[${i}].text=$('ed-note').value.trim()||l[${i}].text;l[${i}].edited=true},'Note updated.')">Save</button></div>`);
 return showModal(head+`<div class="actions">${del}<button class="btn" onclick="closeModal()">Cancel</button></div>`);
}

// --- Backup ---
function openBackup(){
 showModal(`<h2>Backup</h2><p class="muted">The match is saved automatically on this device. Export a copy to move it to another device or keep it safe.</p>
 <div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="exportMatch()" ${meta?'':'disabled'}>Export match file</button><label class="btn">Import match file<input type="file" accept=".json,application/json" hidden onchange="importMatch(this.files[0])"></label></div>`);
}
function exportMatch(){
 const blob=new Blob([JSON.stringify({app:'vb-scoresheet',v:22,meta,log},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=`${(meta.date||'match')}_${teamName('A')}_at_${teamName('B')}.json`.replace(/[^\w.-]+/g,'_');
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importMatch(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);let m,l;
   if(d.app==='vb-scoresheet'){m={...defaultMeta(),...d.meta};l=d.log||[]}else if(d.setupComplete){({meta:m,log:l}=migrateV20(d))}else throw new Error('Not a scoresheet file.');
   const s=replayLog(m,l);
   const go=()=>{meta=m;log=l;st=s;ui.draft=null;save();closeModal();render();toast('Match imported.')};
   if(meta&&log.length)confirmDialog('Replace the match on this device with the imported one?','Replace',go);else go();
  }catch(e){toast('Could not import that file: '+e.message,'error')}};
 r.readAsText(file);
}

// ---------- 7b. Libero Tracking Sheet (LTS) ----------
// Portrait Letter forms, 1360x1760 px: 2026-27 NCAA D-I, NCAA D-II/III and NAIA. One sheet covers the
// whole match: a block per set with Team A on the left and Team B on the right, plus challenge tables.
// Notation follows the NCAA "Scoring & Libero Tracking Procedures" (2026):
//  • S circled for the team serving first; team name; L1/L2 (x when there is none)
//  • Service column: one tally mark each time a player in that position begins a term of service
//  • SP column: starting player ("2c" for the captain)
//  • Substitution: the leaving number is slashed and the entering number is written to its right
//    (circled instead of slashed for an exceptional substitution)
//  • Libero replacement: "L" written to the right of the replaced number (not slashed); when that
//    player returns, the number is written again to the right of the "L". Libero exchanges aren't recorded.

function ltsForm(m=meta){return LTS_FORMS[formKey(m)]}
function buildLTSSet(n){
 const L=st.lineups[n];if(!L)return null;
 const H=st.history.filter(h=>h.set===n),T={};
 for(const t of TEAMS){
  T[t]={tally:[0,0,0,0,0,0],rows:L[t].rot.map(num=>[{num,cap:num===L[t].captain}]),libRows:new Set(),subs:0};
 }
 let term={A:null,B:null};   // slot of the current term of service per team
 for(const h of H){const a=h.a;
  if(a.type==='serve'){if(term[h.team]!==h.slot){T[h.team].tally[h.slot]++;term[h.team]=h.slot}if(h.libero)T[h.team].libRows.add(h.slot)}
  else if((a.type==='rally'||(a.type==='sanction'&&a.kind==='RC'))&&h.sideOut){term[h.servingTeam]=null}
  else if(a.type==='sub'){const row=T[a.team].rows[h.slot];
   for(let i=row.length-1;i>=0;i--)if(row[i].num){row[i].mark=a.exceptional?'circle':'slash';break}
   row.push({num:a.in});if(!a.exceptional)T[a.team].subs++}
  else if(a.type==='libero'&&h.slot!=null&&h.slot!==undefined){const row=T[a.team].rows[h.slot];
   if(h.what==='in')row.push({L:true});else if(h.what==='out')row.push({num:h.player})}
 }
 return {L,T};
}
function ltsSVG(){
 const FM=ltsForm(),ink=new SheetInk('lts'+(meta.date||''));
 for(const n of [1,2,3,4,5]){
  const D=buildLTSSet(n);if(!D)continue;
  const top=FM.tops[n-1],hdrY=top+11,rowY=k=>top+58+(k+.5)*25.4;
  for(const t of TEAMS){
   const X=FM.x[t],d=D.T[t],lb=D.L[t].liberos;
   if(D.L.firstServe===t)ink.loop(X.S,hdrY,10,10);
   ink.text(X.team,hdrY+6,teamName(t),{size:17,cls:'hwb',tilt:.8});
   ink.ctext(X.L1,hdrY,lb.L1||'x',15);ink.ctext(X.L2,hdrY,lb.L2||'x',15);
   for(let k=0;k<6;k++){
    const y=rowY(k);
    for(let i=0;i<d.tally[k];i++){         // tally marks, bundled in fives
     if(i%5===4){const g=Math.floor(i/5),gx=X.service-14+g*30;ink.line(gx-3,y+7,gx+22,y-7,1.6);continue}
     const g=Math.floor(i/5),tx=X.service-14+g*30+(i%5)*6;ink.line(tx,y-8,tx+.6,y+8,1.8);
    }
    if(d.libRows.has(k))ink.tri(X.roman,y+3,30,34);
    const row=d.rows[k],sp=row[0],spLabel=sp.num+(sp.cap?'c':'');
    ink.ctext(X.sp,y,spLabel,16,{tilt:1});
    if(sp.mark==='slash')ink.line(X.sp-9,y+8,X.sp+9,y-9,1.9);else if(sp.mark==='circle')ink.loop(X.sp,y,13,11);
    const rest=row.slice(1),W=e=>e.L?17:String(e.num).length*9+12,total=rest.reduce((s,e)=>s+W(e),0),room=X.wide[1]-X.wide[0],sc=total>room?room/total:1;
    let x=X.wide[0];
    for(const e of rest){const w=W(e)*sc;
     if(e.L)ink.ctext(x+w/2-3,y,'L',16*sc,{tilt:1});
     else{const tw=String(e.num).length*9*sc;ink.text(x,y+6*sc,e.num,{size:16*sc,tilt:1});
      if(e.mark==='slash')ink.line(x-2,y+8*sc,x+tw+2,y-9*sc,1.9);else if(e.mark==='circle')ink.loop(x+tw/2,y,tw/2+5,11)}
     x+=w}
   }
   if(FM.subs)for(let i=0;i<Math.min(d.subs,FM.subs[t].length);i++)ink.slash(FM.subs[t][i],top+221,7);
  }
 }
 // challenge tables (whole match, in order)
 const C=FM.chalRows;
 for(const t of TEAMS){
  const X=FM.chal[t];ink.text(X.team,C.teamY+6,teamName(t),{size:17,cls:'hwb',tilt:.8});
  const list=st.history.filter(h=>h.a.type==='challenge'&&h.a.team===t&&h.a.outcome!=='failure').slice(0,C.n);
  list.forEach((h,i)=>{const y=C.top+(i+.5)*C.step,o=t==='A'?h.score[0]:h.score[1],p=t==='A'?h.score[1]:h.score[0];
   ink.ctext(X.set,y,String(h.set),17);ink.ctext(X.score,y,`${o}-${p}`,17);
   if(h.a.outcome==='stands')ink.loop(X.stands,y,64,13);else ink.loop(X.rev,y,33,13)});
 }
 return `<svg class="ncaaSvg ltsSvg" viewBox="0 0 1360 1760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Libero tracking sheet"><image href="${LTS_IMG[FM.img]}" x="0" y="0" width="1360" height="1760"/><g class="ink">${ink.svg()}</g></svg>`;
}

function openScoresheet(){
 if(!meta)return;const sets=sheetSetsAvailable(),isLTS=ui.sheetSet==='lts';
 if(!isLTS&&!sets.includes(ui.sheetSet))ui.sheetSet=sets[sets.length-1];
 const tabs=sets.map(n=>`<button class="btn ${n===ui.sheetSet?'on':''}" onclick="ui.sheetSet=${n};openScoresheet()">Set ${n}</button>`).join('')+`<button class="btn ${isLTS?'on':''}" onclick="ui.sheetSet='lts';openScoresheet()">Libero tracking</button>`;
 const btns=isLTS?`<button class="btn primary" onclick="printLTS()">Print libero tracking sheet</button>`:`<button class="btn" onclick="printSheets([ui.sheetSet])">Print this set</button><button class="btn primary" onclick="printSheets(sheetSetsAvailable())">Print all sets (${sets.length})</button>`;
 const legend=isLTS?`${formFor().name} libero tracking sheet • Service: one tally per term of service • SP: starting player (c = captain) • slashed number = substituted out, number to its right came in • L = libero replaced that player; the number after L is the player returning • triangle = position where the libero served • prints portrait.`
  :`${formFor().name} form • Circle = point on serve • triangle = libero serve (and over the serving-order numeral where the libero served) • R = serve lost (rotate) • P = replay • plain number = point earned on rotation • S in/out = substitution (Sx = receiving team). To save a PDF, choose “Save as PDF” in the print window.`;

}
// The page size is set per print job: scoresheets print landscape, the libero tracking sheet portrait.
function runPrint(html,portrait,imgSrc){
 $('pageStyle').textContent=`@media print{@page{size:letter ${portrait?'portrait':'landscape'};margin:0}}`;
 $('printArea').innerHTML=html;
 const img=new Image();img.src=imgSrc;
 const go=()=>setTimeout(()=>window.print(),120);
 Promise.all([document.fonts?document.fonts.ready:0,img.decode?img.decode().catch(()=>0):0]).then(go,go);
}
function printSheets(sets){runPrint(sets.map(n=>`<div class="printPage">${sheetSVG(n)}</div>`).join(''),false,FORM_IMG[formFor().img])}
function printLTS(){runPrint(`<div class="printPage portrait">${ltsSVG()}</div>`,true,LTS_IMG[ltsForm().img])}
window.addEventListener('afterprint',()=>{$('printArea').innerHTML=''});

 loadSaved();if(st?.phase==='final')ui.shownFinal=log.length;render();
 if(!meta)openPregame(true);else afterChange();
})();
