<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c6644"><title>Digital Volleyball Scoresheet</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#13231d;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.app{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:850;font-size:21px}.muted{color:#65736c}.pill{background:#dfe9e4;padding:7px 11px;border-radius:99px;font-size:13px;white-space:nowrap}.card{background:white;border:1px solid #d9e1dd;border-radius:16px;box-shadow:0 3px 14px #0000000b;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.score{font-size:64px;font-weight:850;line-height:1;text-align:center;margin:10px}.point{width:100%;padding:18px;border:0;border-radius:12px;background:#0c6644;color:white;font-size:20px;font-weight:850}.point:disabled{background:#9baca4}.court{margin:14px auto;max-width:390px;border:3px solid #bdc9c3;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#bdc9c3}.pos{background:#f8faf9;padding:10px;text-align:center;min-height:61px}.pos small{display:block;color:#68756f}.pos b{font-size:21px}.serve{text-align:center;font-weight:800;min-height:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button,.secondary{padding:11px 14px;border-radius:9px;border:1px solid #bdc9c3;background:white;font-weight:700}.danger{color:#a12626}.log{max-height:260px;overflow:auto;border-top:1px solid #e2e8e5;margin-top:10px}.event{display:flex;gap:14px;padding:9px 3px;border-bottom:1px solid #edf1ef;font-size:14px}.event b{min-width:54px}.setupbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.setupbar input,select,.field{padding:11px;border:1px solid #cbd5d0;border-radius:9px;font-size:16px;width:100%;background:#fff}.status{text-align:center;margin:10px 0;color:#53615a}.sets{display:flex;justify-content:center;gap:7px;margin:8px}.sets span{padding:5px 9px;border-radius:7px;background:#edf2ef}.sets .active{background:#0c6644;color:#fff}.overlay{position:fixed;inset:0;background:#0b1712cc;display:none;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:20}.overlay.open{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:18px;padding:18px;margin:auto}.modal h2{margin:0 0 5px}.lineups{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lineupTeam{border:1px solid #d9e1dd;border-radius:13px;padding:13px}.lineupGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lineupGrid label{font-size:12px;color:#65736c}.lineupGrid input{margin-top:4px;padding:10px;width:100%;font-size:18px;text-align:center;border:1px solid #cbd5d0;border-radius:8px}.liberos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.primary{background:#0c6644!important;color:#fff;border-color:#0c6644!important}.warning{background:#fff5dc;border:1px solid #ecd189;padding:10px;border-radius:10px;margin:10px 0}.serverBox{text-align:center;border:2px solid #0c6644;border-radius:14px;padding:15px;margin:12px 0}.serverBox .big{font-size:28px;font-weight:850}.radioRow{display:grid;gap:8px;margin:12px 0}.radioRow label{border:1px solid #d9e1dd;padding:12px;border-radius:10px}.subgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#e3c5b0;font-size:12px;margin-left:5px}@media(max-width:750px){.grid2,.lineups{grid-template-columns:1fr}.setupbar{grid-template-columns:1fr 1fr}.score{font-size:52px}.app{padding:10px}.modal{padding:15px}.subgrid{grid-template-columns:1fr}.top .muted{display:none}}
</style></head><body><div class="app">
<div class="top"><div><div class="brand">Digital Volleyball Scoresheet</div><div class="muted">Set lineups • server verification • event log</div></div><div class="pill" id="matchState">SET 1</div></div>
<div class="card setupbar"><input id="teamAName" value="Arizona Christian"><input id="teamBName" value="The Master's"></div>
<div class="sets" id="sets"></div><div class="status" id="status"></div>
<div class="grid2"><section class="card"><h2 id="aTitle"></h2><div class="score" id="aScore">0</div><button class="point" id="pointA" onclick="point('A')">+ POINT</button><div class="court" id="courtA"></div><div class="serve" id="serveA"></div></section><section class="card"><h2 id="bTitle"></h2><div class="score" id="bScore">0</div><button class="point" id="pointB" onclick="point('B')">+ POINT</button><div class="court" id="courtB"></div><div class="serve" id="serveB"></div></section></div>
<div class="card" style="margin-top:14px"><div class="toolbar"><button onclick="openSub()">Substitution</button><button onclick="generic('TIMEOUT')">Timeout</button><button onclick="generic('SANCTION')">Sanction</button><button onclick="note()">Note</button><button onclick="undo()">Undo Last Action</button><button class="danger" onclick="resetMatch()">Reset Match</button></div><b>Match Log</b><div class="log" id="log"></div></div></div>
<div class="overlay" id="lineupOverlay"><div class="modal"><h2 id="lineupHeading">Set 1 Lineups</h2><div class="muted">Enter starters in rotation positions I–VI and each team's libero(s).</div><div class="lineups" id="lineupForms"></div><div style="margin-top:12px"><label><b>Team serving first</b></label><select id="setFirstServe"></select></div><div class="actions"><button class="secondary primary" onclick="saveLineups()">Verify Lineups & Continue</button></div></div></div>
<div class="overlay" id="serverOverlay"><div class="modal" style="max-width:520px"><h2>Verify Server</h2><div class="muted" id="serverTeam"></div><div class="serverBox"><div>Expected server</div><div class="big" id="expectedServer"></div></div><div class="radioRow" id="serverChoices"></div><div class="warning" id="serverWarning" style="display:none"></div><div class="actions"><button class="secondary primary" onclick="confirmServer()">Confirm Server</button></div></div></div>
<div class="overlay" id="subOverlay"><div class="modal" style="max-width:620px"><h2>Substitution</h2><div class="subgrid"><div><label>Team</label><select id="subTeam" onchange="fillSubPlayers()"></select></div><div><label>Player OUT</label><select id="subOut"></select></div><div><label>Player IN</label><input class="field" id="subIn" inputmode="numeric" placeholder="Number"></div></div><div class="actions"><button class="secondary" onclick="closeModal('subOverlay')">Cancel</button><button class="secondary primary" onclick="confirmSub()">Confirm Sub</button></div></div></div>
<script>
const labels=['I','II','III','IV','V','VI'];
const fresh=()=>({set:1,scores:{A:0,B:0},setsWon:{A:0,B:0},serving:null,rot:{A:['','','','','',''],B:['','','','','','']},liberos:{A:{L1:'',L2:''},B:{L1:'',L2:''}},lineups:{},events:[],started:false,finished:false,serverVerified:false,actualServer:null,liberoServerSlots:{A:{},B:{}}});
let s=fresh();
function name(t){return document.getElementById(t==='A'?'teamAName':'teamBName').value||`Team ${t}`}
function snap(){return JSON.stringify(s)}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}
function logEvent(type,text,before=snap()){s.events.push({type,text,score:`${s.scores.A}-${s.scores.B}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})})}
function court(t){let el=document.getElementById('court'+t);el.innerHTML='';[3,2,1,4,5,0].forEach(i=>{let d=document.createElement('div');d.className='pos';d.innerHTML=`<small>${labels[i]}</small><b>#${s.rot[t][i]||'—'}</b>`;el.appendChild(d)})}
function rotate(t){s.rot[t]=[s.rot[t][5],s.rot[t][0],s.rot[t][1],s.rot[t][2],s.rot[t][3],s.rot[t][4]]}
function lineupHTML(t){let old=s.lineups[s.set]?.[t]||{rot:s.rot[t],liberos:s.liberos[t]};return `<div class="lineupTeam"><h3>${name(t)}</h3><div class="lineupGrid">${labels.map((p,i)=>`<label>${p}<input id="lu${t}${i}" inputmode="numeric" value="${old.rot?.[i]||''}"></label>`).join('')}</div><b>Liberos</b><div class="liberos"><label>L1<input class="field" id="lib${t}1" inputmode="numeric" value="${old.liberos?.L1||''}" placeholder="Number"></label><label>L2<input class="field" id="lib${t}2" inputmode="numeric" value="${old.liberos?.L2||''}" placeholder="Number"></label></div></div>`}
function openLineups(){document.getElementById('lineupHeading').textContent=`Set ${s.set} Lineups`;document.getElementById('lineupForms').innerHTML=lineupHTML('A')+lineupHTML('B');let fs=document.getElementById('setFirstServe');fs.innerHTML=`<option value="A">${name('A')}</option><option value="B">${name('B')}</option>`;openModal('lineupOverlay')}
function saveLineups(){for(let t of ['A','B']){let r=labels.map((_,i)=>document.getElementById(`lu${t}${i}`).value.trim());if(r.some(x=>!x)){alert(`Enter all six starters for ${name(t)}.`);return}if(new Set(r).size!==6){alert(`${name(t)} has a duplicate starter number.`);return}s.rot[t]=r;s.liberos[t]={L1:document.getElementById(`lib${t}1`).value.trim(),L2:document.getElementById(`lib${t}2`).value.trim()};s.lineups[s.set]=s.lineups[s.set]||{};s.lineups[s.set][t]={rot:[...r],liberos:{...s.liberos[t]}}}s.serving=document.getElementById('setFirstServe').value;s.started=true;s.serverVerified=false;s.actualServer=null;logEvent('LINEUP',`Set ${s.set} lineups verified • ${name(s.serving)} serves first`);closeModal('lineupOverlay');render();openServerVerify()}
function openServerVerify(){if(s.finished||!s.started)return;let t=s.serving, expected=s.rot[t][0];document.getElementById('serverTeam').textContent=`${name(t)} is serving at ${s.scores.A}-${s.scores.B}`;document.getElementById('expectedServer').textContent=`#${expected}`;let opts=[{v:`P:${expected}`,txt:`#${expected} — expected rotation player`}];for(let k of ['L1','L2'])if(s.liberos[t][k])opts.push({v:`${k}:${s.liberos[t][k]}`,txt:`${k} — #${s.liberos[t][k]} serving for #${expected}`});document.getElementById('serverChoices').innerHTML=opts.map((o,i)=>`<label><input type="radio" name="serverChoice" value="${o.v}" ${i===0?'checked':''}> ${o.txt}</label>`).join('')+`<label><input type="radio" name="serverChoice" value="OTHER"> Other / correction <input id="otherServer" inputmode="numeric" style="width:75px;margin-left:8px"></label>`;document.getElementById('serverWarning').style.display='none';openModal('serverOverlay')}
function confirmServer(){let pick=document.querySelector('input[name=serverChoice]:checked');if(!pick)return;let t=s.serving,expected=s.rot[t][0],val=pick.value,server,libero=null;if(val==='OTHER'){server=document.getElementById('otherServer').value.trim();if(!server){alert('Enter the actual server number.');return}if(server!==expected){let w=document.getElementById('serverWarning');w.style.display='block';w.textContent=`Possible wrong server/rotation: #${expected} is expected. Tap Confirm Server again only if #${server} is intentionally being recorded.`;if(!pick.dataset.warned){pick.dataset.warned='1';return}}}else{let [kind,num]=val.split(':');server=num;if(kind==='L1'||kind==='L2'){libero=kind;s.liberoServerSlots[t][expected]={libero:kind,number:num}}}s.actualServer={team:t,number:server,libero,forPlayer:libero?expected:null};s.serverVerified=true;logEvent('SERVER',`${name(t)} server verified • ${libero?libero+' ':''}#${server}${libero?' for #'+expected:''}`);closeModal('serverOverlay');render()}
function point(t){if(s.finished)return;if(!s.started){openLineups();return}if(!s.serverVerified){openServerVerify();return}let before=snap();if(t!==s.serving){rotate(t);s.serving=t;s.serverVerified=false;s.actualServer=null}s.scores[t]++;s.events.push({type:'POINT',text:`Point ${name(t)}`,score:`${s.scores.A}-${s.scores.B}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});if(checkSet())return;render();if(!s.serverVerified)setTimeout(openServerVerify,80)}
function checkSet(){let a=s.scores.A,b=s.scores.B,target=s.set===5?15:25;if((a>=target||b>=target)&&Math.abs(a-b)>=2){let before=snap(),w=a>b?'A':'B';s.setsWon[w]++;s.events.push({type:'SET',text:`Set ${s.set} won by ${name(w)} ${a}-${b}`,score:`${a}-${b}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});if(s.setsWon[w]===3){s.finished=true;render();return true}s.set++;s.scores={A:0,B:0};s.started=false;s.serving=null;s.serverVerified=false;s.actualServer=null;s.rot={A:['','','','','',''],B:['','','','','','']};s.liberos={A:{L1:'',L2:''},B:{L1:'',L2:''}};render();setTimeout(openLineups,100);return true}return false}
function openSub(){if(!s.started){alert('Start the set lineup first.');return}let st=document.getElementById('subTeam');st.innerHTML=`<option value="A">${name('A')}</option><option value="B">${name('B')}</option>`;fillSubPlayers();openModal('subOverlay')}
function fillSubPlayers(){let t=document.getElementById('subTeam').value;document.getElementById('subOut').innerHTML=s.rot[t].map((n,i)=>`<option value="${n}">#${n} — Position ${labels[i]}</option>`).join('')}
function confirmSub(){let t=document.getElementById('subTeam').value,out=document.getElementById('subOut').value,inn=document.getElementById('subIn').value.trim();if(!inn){alert('Enter the player coming in.');return}let idx=s.rot[t].indexOf(out);if(idx<0)return;let before=snap();s.rot[t][idx]=inn;s.events.push({type:'SUBSTITUTION',text:`Substitution • ${name(t)} • #${inn} IN / #${out} OUT`,score:`${s.scores.A}-${s.scores.B}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});closeModal('subOverlay');render()}
function generic(kind){if(!s.started)return;let team=prompt(`${kind}: enter team A or B`,'A');if(!team)return;team=team.toUpperCase();if(!['A','B'].includes(team))return;let before=snap();s.events.push({type:kind,text:`${kind} • ${name(team)}`,score:`${s.scores.A}-${s.scores.B}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});render()}
function note(){let x=prompt('Note');if(x){let before=snap();s.events.push({type:'NOTE',text:x,score:`${s.scores.A}-${s.scores.B}`,before,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});render()}}
function undo(){let e=s.events.pop();if(!e)return;s=JSON.parse(e.before);render()}
function resetMatch(){if(!confirm('Reset the entire match?'))return;localStorage.removeItem('vbscore2');s=fresh();render();setTimeout(openLineups,100)}
function render(){document.getElementById('aTitle').textContent=name('A');document.getElementById('bTitle').textContent=name('B');document.getElementById('aScore').textContent=s.scores.A;document.getElementById('bScore').textContent=s.scores.B;court('A');court('B');for(let t of ['A','B']){let x=document.getElementById('serve'+t);if(s.started&&s.serving===t){let a=s.actualServer;x.innerHTML=a?`● SERVING — ${a.libero?`<span class="badge">${a.libero}</span> `:''}#${a.number}${a.forPlayer?' for #'+a.forPlayer:''}`:`● SERVER NOT VERIFIED`}else x.textContent=''}let locked=!s.started||!s.serverVerified||s.finished;document.getElementById('pointA').disabled=locked;document.getElementById('pointB').disabled=locked;document.getElementById('status').textContent=s.finished?`FINAL • ${name(s.setsWon.A>s.setsWon.B?'A':'B')} wins ${Math.max(s.setsWon.A,s.setsWon.B)}-${Math.min(s.setsWon.A,s.setsWon.B)}`:`Sets: ${name('A')} ${s.setsWon.A} • ${name('B')} ${s.setsWon.B}${s.started&&!s.serverVerified?' • Verify server to continue':''}`;document.getElementById('matchState').textContent=s.finished?'MATCH FINAL':`SET ${s.set}${s.started?' • LIVE':' • LINEUP'}`;document.getElementById('sets').innerHTML=[1,2,3,4,5].map(n=>`<span class="${n===s.set&&!s.finished?'active':''}">${n}</span>`).join('');document.getElementById('log').innerHTML=[...s.events].reverse().map(e=>`<div class="event"><b>${e.score}</b><span>${e.text}<small style="display:block;color:#7b8781">${e.time}</small></span></div>`).join('')||'<div class="event">No events yet.</div>';localStorage.setItem('vbscore2',JSON.stringify(s))}
['teamAName','teamBName'].forEach(id=>document.getElementById(id).addEventListener('input',render));let saved=localStorage.getItem('vbscore2');if(saved){try{s=JSON.parse(saved)}catch{}}render();if(!s.started&&!s.finished)setTimeout(openLineups,150);else if(s.started&&!s.serverVerified)setTimeout(openServerVerify,150);
</script></body></html>
